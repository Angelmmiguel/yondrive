openapi: 3.1.0
info:
  title: YonDrive API
  version: 0.1.0
  summary: HTTP API of a YonDrive server.
  description: |
    The web app and future native clients use this API. The server stores and
    serves content without inspecting it; in end-to-end mode everything it
    receives is ciphertext.

    The specification is written by hand. Go and TypeScript code is generated
    from it (`just api`).

    Binary fields are padded standard base64. Times are RFC 3339 in UTC.
    Failures answer with the `Error` schema, whose `code` is listed there.
    Browsers authenticate with the session cookie, and their state-changing
    requests must be same-origin; native clients use a bearer token, which is
    exempt from that check.
  license:
    name: AGPL-3.0-only
    identifier: AGPL-3.0-only
servers:
  - url: /
    description: The server that delivered this document.
security:
  - sessionCookie: []
  - bearerToken: []
tags:
  - name: system
    description: Liveness and the state of the server.
  - name: setup
    description: The first-run wizard. Every call needs the one-time setup token.
  - name: auth
    description: Signing in and out, registering and changing credentials.
  - name: account
    description: The signed-in user, the session key and other users' public keys.
  - name: drive
    description: The tree of opaque nodes, its versions, uploads, downloads and journal.
  - name: sharing
    description: Grants to other users, key rotation, and the notifications they make.
  - name: links
    description: Public links, as their owner sees them.
  - name: public
    description: |
      What anyone with a public link may read. Nothing here looks at a cookie or a
      bearer token: a link token in `X-Link-Token` is the only authority.
  - name: admin
    description: Server administration. Admins only.
paths:
  /api/v1/health:
    get:
      operationId: getHealth
      tags: [system]
      summary: Report that the server is up
      description: |
        Open to anyone. Tells a client which build it is talking to, whether
        the first-run setup has been completed, and the encryption mode, so
        the web app can choose between the wizard and the sign-in screen and
        check the mode it pinned.
      security: []
      responses:
        "200":
          description: The server is up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        default:
          $ref: "#/components/responses/Error"
  /api/openapi.yaml:
    get:
      operationId: getOpenAPISpec
      tags: [system]
      summary: Fetch this specification
      security: []
      responses:
        "200":
          description: The OpenAPI document this server implements.
          content:
            application/yaml:
              schema:
                type: string
        default:
          $ref: "#/components/responses/Error"
  /api/v1/setup/info:
    get:
      operationId: getSetupInfo
      tags: [setup]
      summary: Describe the environment for the wizard
      description: |
        The data directory is shown, never edited: it is set through the
        environment.
      security:
        - setupToken: []
      responses:
        "200":
          description: The environment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupInfo"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/setup/validate-url:
    post:
      operationId: validateSetupURL
      tags: [setup]
      summary: Check a public URL
      description: |
        Accepts `http` and `https`. Plain HTTP is allowed, and `insecure` tells
        the wizard to warn about it. An unusable address answers
        `invalid_public_url`.
      security:
        - setupToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValidateURLRequest"
      responses:
        "200":
          description: The address, normalised.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidatedURL"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/setup/complete:
    post:
      operationId: completeSetup
      tags: [setup]
      summary: Finish the setup
      description: |
        Atomically stores the server settings and creates the first admin, and
        burns the setup token. The encryption mode is written here once; no
        route can change it. The admin signs in afterwards as any user does.
      security:
        - setupToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupRequest"
      responses:
        "201":
          description: The server is configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedUser"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/auth/methods:
    get:
      operationId: getAuthMethods
      tags: [auth]
      summary: Say how people can sign in here
      description: |
        What the sign-in page shows. With `local_accounts` off the form still has a
        use: the first local admin can always sign in with it, as the way back in when
        the provider is down.
      security: []
      responses:
        "200":
          description: The methods.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthMethods"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/auth/oidc/start:
    get:
      operationId: startOIDC
      tags: [auth]
      summary: Leave for the identity provider
      description: |
        A browser navigates here, top level, and comes back at
        `/auth/oidc/callback`. A failure redirects to `/signin?sso_error=<code>`.
      security: []
      parameters:
        - name: fresh
          in: query
          schema:
            type: boolean
          description: Ask the provider to authenticate again (`prompt=login`, `max_age=300`), for `reauth_required`. The session it makes stands in for a current credential for five minutes after the `auth_time` the provider reports.
      responses:
        "302":
          description: To the provider, or to `/signin?sso_error=<code>`.
          headers:
            Location:
              required: true
              schema:
                type: string
            Set-Cookie:
              description: The sealed state of this sign-in. HttpOnly, host-only, for ten minutes.
              schema:
                type: string
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: startOIDCWithInvite
      tags: [auth]
      summary: Start signing in with an invite
      description: |
        The same, for someone holding an invite link, whose token must stay out of a
        URL. The client calls this and then sets `location` to `authorize_url`. An
        invite with an email is only good for that verified address.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OIDCStartRequest"
      responses:
        "200":
          description: Where to go.
          headers:
            Set-Cookie:
              description: The sealed state of this sign-in.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OIDCStart"
        default:
          $ref: "#/components/responses/Error"
  /auth/oidc/callback:
    get:
      operationId: finishOIDC
      tags: [auth]
      summary: Come back from the identity provider
      description: |
        The redirect URI to register at the provider: the public URL plus this path,
        outside `/api/v1` so that it reads as the address it is. It creates a session
        and redirects to `/`, where the app asks `GET /me` what comes next, with no
        token in any URL. A failure redirects to `/signin?sso_error=<code>`.
      security: []
      parameters:
        - name: code
          in: query
          schema:
            type: string
        - name: state
          in: query
          schema:
            type: string
        - name: error
          in: query
          schema:
            type: string
      responses:
        "302":
          description: To the app.
          headers:
            Location:
              required: true
              schema:
                type: string
            Set-Cookie:
              description: The session cookie, and the state of the sign-in cleared.
              schema:
                type: string
        default:
          $ref: "#/components/responses/Error"
  /api/v1/auth/oidc/enrol:
    post:
      operationId: enrolOIDC
      tags: [auth]
      summary: Store the keys of a single sign-on account, once
      description: |
        `e2e` mode only, on a first sign-in through the provider, when the account
        document says `enrolment_required`. The session is enough this once, as there
        is nothing yet to protect. Afterwards this answers `already_enrolled`, and
        `POST /auth/rekey` with a current credential is the only way to replace them.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrolRequest"
      responses:
        "200":
          description: The account, with its keys.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/oidc/test:
    post:
      operationId: testOIDC
      tags: [setup, admin]
      summary: Test an identity provider
      description: |
        The server fetches the issuer's discovery document and keys, and reports what
        it found. Since this makes the server fetch a URL someone typed, it takes the
        setup token before setup and an admin afterwards, and it answers with stable
        codes and endpoints, never with what a failing address sent back.
      security:
        - setupToken: []
        - sessionCookie: []
        - bearerToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OIDCTestRequest"
      responses:
        "200":
          description: Discovery and keys are in order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OIDCTestResult"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/auth/kdf:
    get:
      operationId: getKDF
      tags: [auth]
      summary: Fetch the parameters to derive an auth key with
      description: |
        Open, as the client needs them before it can sign in. A username that
        does not exist gets stable fake parameters of the same shape, so this
        route cannot tell who has an account.
      security: []
      parameters:
        - name: username
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The parameters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KDF"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Sign in
      description: |
        Takes either auth key, passphrase or recovery. Sets the session cookie
        and returns the account, whose sealed keys are opaque to the server. A
        wrong username and a wrong key answer the same `invalid_credentials`.
        With TOTP on and no code, the right key answers `totp_required`. Only a right
        key learns `local_accounts_disabled`. An account that signs in through the provider
        has no passphrase to sign in with, and answers `invalid_credentials` for any key.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Signed in.
          headers:
            Set-Cookie:
              description: The session cookie.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Sign out
      description: Ends this session and forgets its session key. A bearer token revokes itself.
      responses:
        "204":
          description: Signed out.
          headers:
            Set-Cookie:
              description: Clears the session cookie.
              schema:
                type: string
        default:
          $ref: "#/components/responses/Error"
  /api/v1/auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Create an account
      description: |
        Needs a valid invite token, unless the server allows open sign-up. The
        account and the burning of the invite are one transaction. The new
        user signs in afterwards. Role and quota come from the invite or the
        server default, and an email on the invite takes precedence.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: The account exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedUser"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/auth/rekey:
    post:
      operationId: rekey
      tags: [auth]
      summary: Change the passphrase or the recovery key
      description: |
        A session alone is not enough: the caller must also present a current
        auth key, passphrase or recovery. Atomically replaces the auth hash, KDF
        parameters and wrapped key of each group present, and ends every other
        session and every bearer token of the user but the one in use.

        For a single sign-on account the current auth key is its unlock auth key or its
        recovery auth key, and `auth_key` is the new unlock auth key. In `none` mode such
        an account has no credentials to change, and the answer is `sso_only`.

        The passphrase group is `auth_key`, `kdf` and, in `e2e` mode,
        `wrapped_master_key`. The recovery group, `e2e` mode only, is
        `recovery_auth_key` and `wrapped_master_key_recovery`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RekeyRequest"
      responses:
        "204":
          description: The credentials are replaced.
        default:
          $ref: "#/components/responses/Error"
  /api/v1/auth/totp/enrol:
    post:
      operationId: enrolTOTP
      tags: [auth]
      summary: Start enrolling in TOTP
      description: |
        Needs a current auth key, so that a stolen session cannot lock the owner
        out. TOTP guards local sign-in, so an account that signs in only through a
        provider answers `totp_local_only`. The secret is not in force until confirmed. Secrets are stored on
        the server, readable by it: they protect sign-in only and decrypt
        nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CurrentCredential"
      responses:
        "200":
          description: The secret, to show once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TOTPEnrolment"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/auth/totp/confirm:
    post:
      operationId: confirmTOTP
      tags: [auth]
      summary: Put TOTP in force
      description: Proves the app works and returns the recovery codes, shown only here.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmTOTPRequest"
      responses:
        "200":
          description: In force.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryCodes"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/auth/totp/disable:
    post:
      operationId: disableTOTP
      tags: [auth]
      summary: Turn TOTP off
      description: Needs a current auth key and either a code or a recovery code.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DisableTOTPRequest"
      responses:
        "204":
          description: Off.
        default:
          $ref: "#/components/responses/Error"
  /api/v1/auth/password-reset:
    post:
      operationId: completePasswordReset
      tags: [auth]
      summary: Set a new password from a reset link
      description: |
        `none` mode only. Burns the link, replaces the credentials and ends every
        session and token of the user, in one transaction.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompletePasswordResetRequest"
      responses:
        "204":
          description: The password is replaced.
        default:
          $ref: "#/components/responses/Error"
  /api/v1/session/key:
    get:
      operationId: getSessionKey
      tags: [account]
      summary: Fetch the server half of the session key
      description: Answers `no_session_key` if none was set, as after a server restart.
      responses:
        "200":
          description: The key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionKey"
        default:
          $ref: "#/components/responses/Error"
    put:
      operationId: putSessionKey
      tags: [account]
      summary: Store the server half of the session key
      description: Held in memory only, and never written to the database.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionKey"
      responses:
        "204":
          description: Stored, replacing any previous key.
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteSessionKey
      tags: [account]
      summary: Forget the server half of the session key
      description: The client's lock. The session itself goes on.
      responses:
        "204":
          description: Forgotten.
        default:
          $ref: "#/components/responses/Error"
  /api/v1/me:
    get:
      operationId: getMe
      tags: [account]
      summary: Fetch the signed-in account
      description: The same document login returns, so a locked client can unlock.
      responses:
        "200":
          description: The account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/users/{id}/keys:
    get:
      operationId: getUserKeys
      tags: [account]
      summary: Fetch a user's public keys
      description: |
        Clients compute the safety number from these. Answers `no_keys` in
        `none` mode.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: The keys.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserKeys"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/me/tokens:
    get:
      operationId: listTokens
      tags: [account]
      summary: List the signed-in user's device tokens
      responses:
        "200":
          description: The tokens, oldest first. Their secrets are not kept.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DeviceToken"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createToken
      tags: [account]
      summary: Create a bearer token for a device
      description: |
        Needs a current auth key: a stolen session must not be able to mint
        access that outlives it. A token lasts until it is revoked, or until the
        credentials change.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTokenRequest"
      responses:
        "201":
          description: The token. Its secret is shown only here.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedToken"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/me/tokens/{id}:
    delete:
      operationId: revokeToken
      tags: [account]
      summary: Revoke a device token
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "204":
          description: Revoked.
        default:
          $ref: "#/components/responses/Error"
  /api/v1/admin/invites:
    get:
      operationId: listInvites
      tags: [admin]
      summary: List invites
      responses:
        "200":
          description: The invites, newest first. Tokens are not kept.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Invite"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createInvite
      tags: [admin]
      summary: Create a one-time invite
      description: |
        An invite with the `admin` role needs the admin's current auth key: a
        stolen admin session must not be able to mint another admin that
        outlives it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInviteRequest"
      responses:
        "201":
          description: The invite. Its token is shown only here.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedInvite"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/admin/invites/{id}:
    delete:
      operationId: deleteInvite
      tags: [admin]
      summary: Revoke an invite
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "204":
          description: Revoked.
        default:
          $ref: "#/components/responses/Error"
  /api/v1/admin/users:
    get:
      operationId: listUsers
      tags: [admin]
      summary: List users
      responses:
        "200":
          description: Every user, by username.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Profile"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/admin/users/{id}:
    patch:
      operationId: updateUser
      tags: [admin]
      summary: Disable or enable a user, or set their quota
      description: |
        Disabling ends the user's sessions and tokens. Admins cannot disable
        themselves, so a server always keeps an admin who can sign in.
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: The user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteUser
      tags: [admin]
      summary: Delete a user
      description: |
        Admins cannot delete themselves. Removes the user's bytes at once, with no
        purge grace, so it needs the admin's current auth key: a stolen admin
        session must not be able to destroy an account.
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CurrentCredential"
      responses:
        "204":
          description: Deleted.
        default:
          $ref: "#/components/responses/Error"
  /api/v1/admin/users/{id}/identity:
    delete:
      operationId: unlinkIdentity
      tags: [admin]
      summary: Forget which provider identity an account is
      description: |
        Sign-in never moves an account to another identity by itself. After a provider
        migration, this lets the next sign-in link it again under the match mode. It
        ends the user's sessions and tokens, and needs a current credential.
        Answers `identity_not_relinkable` (409) when the match mode could not find the
        account again: `sub`, or `email` or `preferred_username` for an account without
        one, since the next sign-in would make an empty account.
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CurrentCredential"
      responses:
        "204":
          description: Forgotten.
        default:
          $ref: "#/components/responses/Error"
  /api/v1/admin/users/{id}/password-reset:
    post:
      operationId: createPasswordReset
      tags: [admin]
      summary: Issue a one-time password reset link
      description: |
        `none` mode only, since no key depends on the password. In `e2e` mode it
        answers `wrong_mode`: only the user's recovery key can recover an account.
        Needs the admin's current auth key: a stolen admin session must not be
        able to take over an account.
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CurrentCredential"
      responses:
        "201":
          description: The link, which replaces any earlier one. Shown only here.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedPasswordReset"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/admin/settings:
    get:
      operationId: getSettings
      tags: [admin]
      summary: Read the server settings
      responses:
        "200":
          description: The settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerSettings"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateSettings
      tags: [admin]
      summary: Change the server settings
      description: Everything but the encryption mode, which is fixed at setup.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSettingsRequest"
      responses:
        "200":
          description: The settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerSettings"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/admin/health:
    get:
      operationId: getAdminHealth
      tags: [admin]
      summary: Report the health of the server's storage
      description: |
        Stored and reserved bytes, files waiting to be removed, free disk space
        and when `yondrive backup` last finished.
      responses:
        "200":
          description: The figures.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminHealth"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/admin/audit:
    get:
      operationId: listAudit
      tags: [admin]
      summary: Read the audit trail
      description: |
        Security events, newest first. An entry names what happened, who did it, to
        what and from where, and never holds content or a secret. The trail keeps
        `audit_retention_days` of history.
      parameters:
        - name: cursor
          in: query
          schema:
            type: string
          description: The `next_cursor` of the previous page.
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditPage"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/me/storage:
    get:
      operationId: getMyStorage
      tags: [drive]
      summary: Report the signed-in user's storage
      responses:
        "200":
          description: The figures.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Storage"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/nodes/root:
    get:
      operationId: getRootNode
      tags: [drive]
      summary: Fetch the signed-in user's root node
      description: Answers `not_found` until a client has created it.
      responses:
        "200":
          description: The root.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Node"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createRootNode
      tags: [drive]
      summary: Create the signed-in user's root node on demand
      description: |
        The key of a root is wrapped under the master key, so only a client can
        make one. If there already is a root, the answer is that root with a 200,
        which decides between two devices racing: a client must use the node it
        gets back and not the one it sent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRootRequest"
      responses:
        "200":
          description: A root existed, and this is it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Node"
        "201":
          description: The new root.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Node"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/nodes:
    post:
      operationId: createNode
      tags: [drive]
      summary: Create a file or folder
      description: |
        The client chooses the id, since it enters the AAD before sealing. A file
        has no content until its first upload commits. Answers `id_taken` if the
        id exists, `name_conflict` if a sibling outside the trash has the tag,
        `not_a_folder`, `parent_trashed` or `tree_too_deep`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateNodeRequest"
      responses:
        "201":
          description: The new node.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Node"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/nodes/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: getNode
      tags: [drive]
      summary: Fetch a node
      responses:
        "200":
          description: The node.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Node"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateNode
      tags: [drive]
      summary: Replace a node's metadata and, on a rename, its name tag
      description: Answers `name_conflict`, or `node_trashed` under the trash.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateNodeRequest"
      responses:
        "200":
          description: The node.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Node"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/nodes/{id}/children:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: listChildren
      tags: [drive]
      summary: List a folder's children outside the trash
      description: Paged by id. Sorting by name happens on the client.
      parameters:
        - $ref: "#/components/parameters/IDCursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page, in id order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodePage"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/nodes/{id}/move:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      operationId: moveNode
      tags: [drive]
      summary: Move a node to another folder
      description: |
        The key wrapped under the old parent and the tag made under it are
        replaced in one transaction with the move. The client's own key and its
        children's are untouched. Answers `move_cycle`, `name_conflict`,
        `not_a_folder`, `node_trashed`, `parent_trashed`, `root_immutable` or
        `tree_too_deep`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MoveNodeRequest"
      responses:
        "200":
          description: The node.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Node"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/nodes/{id}/trash:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      operationId: trashNode
      tags: [drive]
      summary: Put a node and its subtree in the trash
      description: |
        Sets the trashed time on this node alone. Everything under it stays
        readable and frozen, and quota keeps counting it. Doing it twice changes
        nothing. A root answers `root_immutable`.
      responses:
        "200":
          description: The node.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Node"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/nodes/{id}/restore:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      operationId: restoreNode
      tags: [drive]
      summary: Take a node out of the trash
      description: |
        Also cancels a purge whose grace period is not over. Answers `not_trashed`,
        `parent_trashed` if the folder it returns to is in the trash, or
        `name_conflict` if its name has been taken there since.
      responses:
        "200":
          description: The node.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Node"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/nodes/{id}/purge:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      operationId: purgeNode
      tags: [drive]
      summary: Mark a trashed node for removal
      description: |
        The bytes stay, and stay counted against quota, until `remove_at`: a
        stolen session cannot destroy anything before the grace period is over,
        and whoever notices in time can restore the node. Repeating the call does
        not move the time. Answers `not_trashed` outside the trash.
      responses:
        "200":
          description: The node.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Node"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/trash:
    get:
      operationId: listTrash
      tags: [drive]
      summary: List the signed-in user's trash
      description: |
        Every node trashed in its own right, marked for removal or not. What is
        under a trashed folder is reached through that folder.
      parameters:
        - $ref: "#/components/parameters/IDCursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page, in id order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodePage"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/trash/empty:
    post:
      operationId: emptyTrash
      tags: [drive]
      summary: Mark everything in the trash for removal
      description: As purging each node, with the same grace period.
      responses:
        "200":
          description: How many nodes were marked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmptiedTrash"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/nodes/{id}/versions:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: listVersions
      tags: [drive]
      summary: List a file's versions, newest first
      description: |
        Without the frame hashes, the signature and the manifest, which come with
        a single version. Includes versions marked for removal, until they go.
      parameters:
        - name: cursor
          in: query
          schema:
            type: string
          description: The `next_cursor` of the previous page.
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionPage"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/nodes/{id}/versions/{version_id}:
    parameters:
      - $ref: "#/components/parameters/ID"
      - $ref: "#/components/parameters/VersionID"
    get:
      operationId: getVersion
      tags: [drive]
      summary: Fetch a version, with what a client needs to verify it
      responses:
        "200":
          description: The version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Version"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteVersion
      tags: [drive]
      summary: Mark a version that is not current for removal
      description: |
        Its blob stays, and stays counted, until `remove_at`, and it can be
        restored until then. A blob goes with the last version that references it.
        Answers `version_current` for the current version.
      responses:
        "200":
          description: The version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Version"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/nodes/{id}/versions/{version_id}/restore:
    parameters:
      - $ref: "#/components/parameters/ID"
      - $ref: "#/components/parameters/VersionID"
    post:
      operationId: restoreVersion
      tags: [drive]
      summary: Make a new current version from an older one
      description: |
        A new version over the same blob, with no copy and nothing new against
        quota. The frames stay sealed and signed under the id they were written
        with, which the new version gives as `content_version_id`. Answers
        `version_conflict` (412) if `expected_version` no longer holds.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RestoreVersionRequest"
      responses:
        "201":
          description: The new version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Version"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/nodes/{id}/editing:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: getEditing
      tags: [drive]
      summary: List who else has this file open in an editor
      description: |
        The other people whose heartbeat on this node is recent and who can
        still read it. A warning for the person about to edit, never a lock.
        Anyone who can read the node may ask.
      responses:
        "200":
          description: Who else is editing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Editing"
        default:
          $ref: "#/components/responses/Error"
    put:
      operationId: putEditing
      tags: [drive]
      summary: Say that the caller has this file open in an editor
      description: |
        A heartbeat. It holds for `ttl_seconds`, so an editor sends it again
        well before then and simply stops when it closes. Needs write access.
        Answers with who else is editing, as `getEditing` does.
      responses:
        "200":
          description: Who else is editing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Editing"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/uploads:
    get:
      operationId: listUploads
      tags: [drive]
      summary: List the signed-in user's uploads in progress
      description: |
        Every upload this user started and has not committed or aborted, in id order,
        so that one whose id was lost can be resumed or aborted rather than holding
        its reservation until it is dropped.
      parameters:
        - $ref: "#/components/parameters/IDCursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadPage"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createUpload
      tags: [drive]
      summary: Start uploading a version of a file
      description: |
        Reserves `stored_size` bytes against the owner's quota, or answers 413
        `quota_exceeded`. Frames then arrive in any order and any number of times,
        until a commit or an abort. An upload untouched for a week is dropped and
        its reservation released.

        A user has at most 100 uploads in progress at once; one more answers 409
        `too_many_uploads` until one is committed or aborted.

        `frame_size` is the plaintext frame size of CRYPTO.md, at most 16 MiB. A
        stored frame is that long plus the 41 bytes of overhead in end-to-end mode.
        `stored_size` must agree with `frame_size` and `frame_count`, or the answer
        is `invalid_framing`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUploadRequest"
      responses:
        "201":
          description: The upload, with no frames yet.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Upload"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/uploads/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: getUpload
      tags: [drive]
      summary: Report which frames of an upload have arrived
      description: What a client resumes from.
      responses:
        "200":
          description: The upload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Upload"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: abortUpload
      tags: [drive]
      summary: Abandon an upload and release its reservation
      responses:
        "204":
          description: Gone.
        default:
          $ref: "#/components/responses/Error"
  /api/v1/uploads/{id}/frames/{n}:
    parameters:
      - $ref: "#/components/parameters/ID"
      - name: n
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 0
        description: The frame's index, from 0.
    put:
      operationId: putFrame
      tags: [drive]
      summary: Send one stored frame
      description: |
        The body must have exactly the length this frame has by the upload's
        framing (`frame_length`) and the digest in the header (`frame_hash`). Once
        it is on disk the answer is 204, and the same frame again is a retry that
        also answers 204, without being stored twice. A frame that has arrived does
        not change: another digest answers `frame_conflict`.
      parameters:
        - $ref: "#/components/parameters/ContentSHA256"
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "204":
          description: The frame is on disk.
        default:
          $ref: "#/components/responses/Error"
  /api/v1/uploads/{id}/commit:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      operationId: commitUpload
      tags: [drive]
      summary: Turn a complete upload into the file's current version
      description: |
        Atomically moves the file into place, adds the version and journals it.
        Answers `upload_incomplete` if a frame is missing, `node_trashed`, or
        `version_conflict` (412) if `expected_version` no longer holds, each with
        the upload left as it was. After a lost answer the upload answers
        `not_found`, and the version is in the node's list.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommitUploadRequest"
      responses:
        "201":
          description: The new version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Version"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/blobs/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: getBlob
      tags: [drive]
      summary: Read a stored file
      description: |
        Bytes as stored, with `Range` support, authorised through the node they
        belong to. Always `application/octet-stream` as an attachment, never cached.
      parameters:
        - name: Range
          in: header
          schema:
            type: string
          examples:
            frame:
              value: bytes=0-4194344
        - name: If-Range
          in: header
          schema:
            type: string
          description: The `ETag` of an earlier answer. A blob's bytes never change.
      responses:
        "200":
          description: The whole file.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "206":
          description: The range.
          headers:
            ETag:
              schema:
                type: string
            Content-Range:
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "416":
          description: The range does not fit the file.
          headers:
            Content-Range:
              schema:
                type: string
          content:
            text/plain:
              schema:
                type: string
        default:
          $ref: "#/components/responses/Error"
    put:
      operationId: putSmallBlob
      tags: [drive]
      summary: Store a thumbnail or an index segment
      description: |
        Up to 16 MiB, in one request, under an id the client chose. A `thumb` needs
        a `node_id`, and replaces that node's thumbnail. An `index` is tied to the
        user. Both count against quota (`quota_exceeded`, 413).
      parameters:
        - name: kind
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/SmallBlobKind"
        - name: suite
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/Suite"
        - name: node_id
          in: query
          schema:
            type: string
            pattern: "^[0-9a-f]{32}$"
          description: The node of a thumbnail.
        - $ref: "#/components/parameters/ContentSHA256"
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: The blob.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SmallBlob"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteSmallBlob
      tags: [drive]
      summary: Remove a thumbnail or an index segment
      description: |
        Clients can make these again, so they have no grace period. Content goes
        with its versions: a content blob answers `blob_in_use`.
      responses:
        "204":
          description: Gone.
        default:
          $ref: "#/components/responses/Error"
  /api/v1/me/index:
    get:
      operationId: listIndexBlobs
      tags: [drive]
      summary: List the signed-in user's index segments
      parameters:
        - $ref: "#/components/parameters/IDCursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page, in id order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SmallBlobPage"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/changes:
    get:
      operationId: listChanges
      tags: [drive]
      summary: Read the change journal
      description: |
        What happened to the nodes the signed-in user can reach, in order, written
        as it happens: their own, and those a grant covers at that moment. Start
        with no cursor, and store each page's `next_cursor`. A client that comes
        back with it misses nothing. An operation on a subtree appears once, on its
        root.

        The journal keeps `journal_retention_days` of history. A cursor from before
        what was trimmed of this user's journal answers 410 `cursor_expired`: changes
        have been lost to it, so the client reads the tree again and starts over with
        no cursor. Having no cursor never answers that.
      parameters:
        - name: cursor
          in: query
          schema:
            type: string
          description: The `next_cursor` of the previous page. Absent starts at the beginning.
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangePage"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/users/lookup:
    get:
      operationId: lookupUser
      tags: [sharing]
      summary: Find a user by exact username, to share with them
      description: |
        There is no listing and no partial match. An unknown username, a disabled
        account and a malformed one all answer `not_found`. Limited per user and per
        address (`rate_limited`). `public_keys` is absent in `none` mode.
      parameters:
        - name: username
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserLookup"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/grants:
    get:
      operationId: listGrantsMade
      tags: [sharing]
      summary: List the grants the signed-in user has made
      description: With the links, this is the "shared by me" page.
      parameters:
        - $ref: "#/components/parameters/IDCursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page, in id order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GrantPage"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createGrant
      tags: [sharing]
      summary: Share a node with a user
      description: |
        Only the owner shares, and a grant covers the subtree. Answers `grant_exists`
        if the user has a grant on this node (change its role instead),
        `invalid_grant` if they are the owner, or the sealed key or signature are the
        wrong size for the mode, `root_immutable`, `node_trashed`, `not_found` if the
        user does not exist, or `key_generation_conflict`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGrantRequest"
      responses:
        "201":
          description: The grant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Grant"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/grants/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    patch:
      operationId: updateGrant
      tags: [sharing]
      summary: Change the role of a grant
      description: Owner only. Uploads an editor made a viewer had going are dropped.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateGrantRequest"
      responses:
        "200":
          description: The grant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Grant"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteGrant
      tags: [sharing]
      summary: Revoke a grant, or give up one's own
      description: |
        By the owner, or by the holder of the grant. Access ends at once. In `e2e`
        mode, an owner revoking MUST then rotate the node and what is under it, as
        the former grantee may have kept the keys: see `rotateNode`.
      responses:
        "204":
          description: Gone.
        default:
          $ref: "#/components/responses/Error"
  /api/v1/nodes/{id}/grants:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: listNodeAccess
      tags: [sharing]
      summary: List who can reach a node through a grant
      description: |
        The grants on the node and on the folders above it, nearest first, for anyone
        who can read the node: a client verifies a version's signature against an
        author who holds edit rights, and they are the owner and the editors here.
        The owner gets every grant, with its sealed key and signature. Anyone else
        gets their own grants and the editors', and not who else may only read.
      responses:
        "200":
          description: The list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeAccessList"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/nodes/{id}/rotate:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      operationId: rotateNode
      tags: [sharing]
      summary: Replace a node's key, after revoking someone
      description: |
        Owner only. CRYPTO.md, section 8, says how each field is made. One transaction swaps the
        key, the old key's link in the chain, the metadata, the wraps and tags of all
        children and the sealed grants, and removes the thumbnail. Versions stay as
        they are, and `key_chain` reaches their keys.

        This is one node. To revoke from a subtree, rotate its top and then each node
        under it, parents first, so each wrap is made under the parent's new key. A
        node whose `key_generation` has moved on is done, which lets a client resume.

        Answers `rotate_conflict` if the list of children or grants is not what the
        node has now, because someone has just created or shared one; read them again.
        A grant or link the owner did not make, which a server could add, is named in
        `drop_grants` or `drop_links`: the rotation removes it rather than leaving it
        holding the old key, or failing for good.
        Also `key_generation_conflict`, `invalid_rotation`, `name_conflict`,
        `root_immutable`, or `too_large` when a folder's children do not fit in 16 MiB.
        Works the same in `none` mode, where nothing is sealed, though nothing needs it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RotateNodeRequest"
      responses:
        "200":
          description: The node, at its new generation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Node"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/shared-with-me:
    get:
      operationId: listSharedWithMe
      tags: [sharing]
      summary: List the grants the signed-in user holds
      description: Each with its node. What is in the owner's trash is left out, so a page can be short with more to come.
      parameters:
        - $ref: "#/components/parameters/IDCursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page, in id order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GrantPage"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/notifications:
    get:
      operationId: listNotifications
      tags: [sharing]
      summary: List what has been shared with the signed-in user and not marked as read
      responses:
        "200":
          description: The list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationList"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/notifications/read:
    post:
      operationId: markNotificationsRead
      tags: [sharing]
      summary: Mark notifications as read
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarkNotificationsReadRequest"
      responses:
        "204":
          description: Marked. Ids that are not the caller's are ignored.
        default:
          $ref: "#/components/responses/Error"
  /api/v1/links:
    get:
      operationId: listLinks
      tags: [links]
      summary: List the signed-in user's links
      description: With the grants made, this is the "shared by me" page. Revoked and expired links stay until deleted.
      parameters:
        - $ref: "#/components/parameters/IDCursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page, in id order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkPage"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createLink
      tags: [links]
      summary: Make a public link to a node
      description: |
        Owner only, and it covers the subtree. Answers `id_taken`, `invalid_link`,
        `invalid_kdf`, `root_immutable`, `node_trashed` or `key_generation_conflict`.
        CRYPTO.md, section 19, says how the keys are made.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLinkRequest"
      responses:
        "201":
          description: The link.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Link"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/links/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    delete:
      operationId: deleteLink
      tags: [links]
      summary: Forget a link
      description: After this its id answers `not_found`.
      responses:
        "204":
          description: Gone.
        default:
          $ref: "#/components/responses/Error"
  /api/v1/links/{id}/revoke:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      operationId: revokeLink
      tags: [links]
      summary: End a link, keeping its row
      description: After this its id answers `link_revoked`, and tokens already given stop working.
      responses:
        "200":
          description: The link.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Link"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/public/links/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: getPublicLink
      tags: [public]
      summary: Open a public link
      description: |
        With no password, the link's node and a token. With a password, its KDF
        parameters: derive, then call `unlockPublicLink`. A valid `X-Link-Token` for this
        link goes straight to `open` and renews the token within its session, which lasts
        at most a day. Limited per address, and on a password per link as well
        (`rate_limited`). Answers `not_found` for what does not exist, or whose node is in
        the trash, `link_expired`, `link_revoked`, or `link_limit_reached` to someone
        new once the limit has been reached.
      security: []
      parameters:
        - $ref: "#/components/parameters/LinkToken"
      responses:
        "200":
          description: The state of the link.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicLink"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/public/links/{id}/unlock:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      operationId: unlockPublicLink
      tags: [public]
      summary: Show the password of a link
      description: |
        Compares the hash in constant time, and answers `link_password_invalid` if it is
        wrong. Every attempt counts against the address and the link, right or wrong
        (`rate_limited`). The answer is the same as an open link's.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UnlockLinkRequest"
      responses:
        "200":
          description: The link, open.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicLink"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/public/links/{id}/nodes/{node_id}:
    parameters:
      - $ref: "#/components/parameters/ID"
      - $ref: "#/components/parameters/LinkNodeID"
    get:
      operationId: getPublicNode
      tags: [public]
      summary: Read a node under a link
      security: []
      parameters:
        - $ref: "#/components/parameters/LinkToken"
      responses:
        "200":
          description: The node.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicNode"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/public/links/{id}/nodes/{node_id}/children:
    parameters:
      - $ref: "#/components/parameters/ID"
      - $ref: "#/components/parameters/LinkNodeID"
    get:
      operationId: listPublicChildren
      tags: [public]
      summary: List a folder's children under a link
      security: []
      parameters:
        - $ref: "#/components/parameters/LinkToken"
        - $ref: "#/components/parameters/IDCursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page, in id order, without what is in the trash.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicNodePage"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/public/links/{id}/nodes/{node_id}/version:
    parameters:
      - $ref: "#/components/parameters/ID"
      - $ref: "#/components/parameters/LinkNodeID"
    get:
      operationId: getPublicVersion
      tags: [public]
      summary: Read a file's current version under a link
      description: A link shows no history. Answers `not_found` until a file's first commit.
      security: []
      parameters:
        - $ref: "#/components/parameters/LinkToken"
      responses:
        "200":
          description: The version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicVersion"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/public/links/{id}/blobs/{blob_id}:
    parameters:
      - $ref: "#/components/parameters/ID"
      - name: blob_id
        in: path
        required: true
        schema:
          type: string
          pattern: "^[0-9a-f]{32}$"
        description: The current version or the thumbnail of a node at or under the link's.
    get:
      operationId: getPublicBlob
      tags: [public]
      summary: Read a stored file under a link
      description: |
        As `getBlob`. Content counts against the download limit the first time a session
        fetches any of it, whatever the range, so reading a file by frames counts once;
        a new session counts again, as does one that lost its token and started over. A
        file that was started counts whether or not it finished. Thumbnails do not count.
        Answers `link_limit_reached` when nothing is left.
      security: []
      parameters:
        - $ref: "#/components/parameters/LinkToken"
        - name: Range
          in: header
          schema:
            type: string
        - name: If-Range
          in: header
          schema:
            type: string
      responses:
        "200":
          description: The whole file.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "206":
          description: The range.
          headers:
            ETag:
              schema:
                type: string
            Content-Range:
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "416":
          description: The range does not fit the file.
          headers:
            Content-Range:
              schema:
                type: string
          content:
            text/plain:
              schema:
                type: string
        default:
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: yondrive_session
      description: HttpOnly, SameSite=Strict session cookie set by login, named `__Host-yondrive_session` over HTTPS.
    bearerToken:
      type: http
      scheme: bearer
      description: A named per-device token.
    setupToken:
      type: apiKey
      in: header
      name: X-Setup-Token
      description: The one-time token from the setup link in the server's logs.
  schemas:
    Health:
      type: object
      required: [status, version, setup]
      properties:
        status:
          type: string
          enum: [ok]
        version:
          type: string
          description: Build version of the server, or `dev`.
          examples: ["0.1.0"]
        commit:
          type: string
          description: The git commit the server was built from, or `unknown`.
        web_bundle:
          $ref: "#/components/schemas/WebBundle"
        setup:
          type: boolean
          description: Whether the first-run setup has been completed.
        mode:
          $ref: "#/components/schemas/Mode"
    WebBundle:
      type: string
      pattern: "^[0-9a-f]{64}$"
      description: |
        SHA-256 root hash of the web app the server embeds: the hash of the list
        of files and their hashes that `yondrive assets` prints. A release
        publishes the same value, so the two can be compared. A server can report
        any value here, so this helps notice a mismatch and proves nothing on its
        own; see docs/RELEASE.md.
    Mode:
      type: string
      description: |
        The encryption mode of the whole server, fixed at setup. Absent from
        health until then.
      enum: [e2e, none]
    Error:
      type: object
      required: [code]
      properties:
        code:
          type: string
          description: |
            Stable machine-readable identifier, never a free-form message:

            - `bad_request`, `not_found`, `forbidden`, `internal`, `too_large`,
              `rate_limited`
            - `unauthorized`: no valid session or token
            - `setup_token_invalid`, `already_setup`, `not_setup`
            - `invalid_username`, `invalid_email`, `invalid_kdf`,
              `invalid_auth_key`, `invalid_keys`, `invalid_settings`,
              `invalid_public_url`, `invalid_mode`
            - `keys_required`, `keys_not_allowed`: the blobs do not fit the mode
            - `username_taken`, `email_taken`, `invite_invalid`, `signup_closed`
            - `invalid_credentials`: wrong username or auth key on sign-in
            - `wrong_credential`: wrong current auth key on a signed-in action
            - `invalid_rekey`: the groups of a rekey are incomplete
            - `user_disabled`: right credentials, disabled account
            - `invalid_session_key`, `no_session_key`, `no_keys`, `invalid_invite`
            - `totp_required`, `totp_invalid`, `totp_already_enabled`,
              `totp_not_pending`, `totp_not_enabled`
            - `invalid_token_name`
            - `cannot_modify_self`, `invalid_quota`, `wrong_mode`, `reset_invalid`
            - `session_required`: the route needs a browser session, not a token
            - `invalid_id`: an id is not 32 lowercase hex characters
            - `id_taken`: a client-chosen id exists
            - `suite_mismatch`: the suite is not the one of the server's mode
            - `invalid_node`: a sealed field is missing, or the wrong size for the mode
            - `name_conflict`: a sibling outside the trash has the name tag
            - `not_a_folder`, `not_a_file`, `move_cycle`, `tree_too_deep`, `root_immutable`
            - `node_trashed`, `parent_trashed`, `not_trashed`
            - `version_conflict`: the current version has moved on (412)
            - `version_current`: the current version cannot be deleted
            - `invalid_framing`: an upload's sizes do not agree
            - `invalid_frame`: no such frame in this upload
            - `frame_length`, `frame_hash`, `frame_conflict`: a frame was refused
            - `invalid_commit`: the signature or manifest is the wrong size
            - `upload_incomplete`: frames are missing
            - `too_many_uploads`: the user has 100 uploads in progress
            - `quota_exceeded`: the owner's quota has no room (413)
            - `storage_full`: the server's disk has no room (507)
            - `invalid_blob`: the kind and node of a small blob do not agree
            - `blob_in_use`: content goes with its versions
            - `sso_disabled`: single sign-on is not turned on
            - `sso_only`: the action needs a local password, which this account does not have
            - `local_accounts_disabled`: local sign-in and registration are off
            - `local_accounts_lockout`: the change would leave nobody able to sign in
            - `identity_not_relinkable`: the match mode could not find this account after its identity is forgotten (409)
            - `already_enrolled`: the account has its keys; `POST /auth/rekey` replaces them
            - `totp_local_only`: the identity provider handles the second factor of this account
            - `reauth_required`: sign in through the provider again with `fresh=true`, and retry within five minutes
            - `invalid_issuer`: not a usable issuer address; https unless `allow_insecure`
            - `invalid_oidc_settings`
            - `oidc_discovery_failed`, `oidc_issuer_mismatch`, `oidc_keys_failed`: testing a provider (502)
            - `sso_state_invalid`, `sso_denied`, `sso_provider_error`, `sso_token_invalid`,
              `sso_identity_conflict`, `sso_email_unverified`, `sso_not_invited`,
              `sso_reauth_unconfirmed` (a fresh sign-in whose `auth_time` is missing or
              older than five minutes): a failed sign-in, given in `?sso_error=` on `/signin`
              rather than as a response body
            - `invalid_cursor`
            - `cursor_expired`: the journal has been trimmed past this cursor (410). Read
              the tree again, then start over with no cursor
            - `forbidden` on a node: the caller can see it, and their role does not allow this
            - `key_generation_conflict`: sealed under a key that has been rotated (412)
            - `move_refused`: the move leaves the shared subtree or crosses owners
            - `grant_exists`, `invalid_grant`
            - `invalid_rotation`: a sealed field of a rotation is the wrong size
            - `rotate_conflict`: a rotation does not name what the node has now
            - `invalid_link`: a field of a new link is the wrong size, or in the past
            - `link_expired`, `link_revoked`: the link has ended (410)
            - `link_limit_reached`: the link has given all its downloads (410)
            - `link_token_required`, `link_token_invalid`: no good `X-Link-Token` (401)
            - `link_password_invalid`: wrong password (401)
          examples: [not_found]
    KDF:
      type: object
      description: Argon2id parameters, which the client runs.
      required: [name, m, t, p, salt]
      properties:
        name:
          type: string
          enum: [argon2id]
        m:
          type: integer
          description: Memory in KiB.
          minimum: 8192
          maximum: 1048576
          examples: [65536]
        t:
          type: integer
          description: Iterations.
          minimum: 1
          maximum: 10
          examples: [3]
        p:
          type: integer
          description: Lanes.
          minimum: 1
          maximum: 1
          examples: [1]
        salt:
          type: string
          format: byte
          description: 16 bytes.
    PublicKeys:
      type: object
      required: [x25519, ed25519]
      properties:
        x25519:
          type: string
          format: byte
          description: 32 bytes.
        ed25519:
          type: string
          format: byte
          description: 32 bytes.
    AccountKeys:
      type: object
      description: |
        The account's keys as the client seals them. Opaque to the server, which
        checks only their encoding and size. Present in `e2e` mode, absent in
        `none`.
      required:
        - wrapped_master_key
        - wrapped_master_key_recovery
        - sealed_x25519
        - sealed_ed25519
        - public_keys
      properties:
        wrapped_master_key:
          type: string
          format: byte
          description: The master key wrapped under the passphrase KEK.
        wrapped_master_key_recovery:
          type: string
          format: byte
          description: The master key wrapped under the recovery KEK.
        sealed_x25519:
          type: string
          format: byte
          description: The X25519 private key sealed under the master key.
        sealed_ed25519:
          type: string
          format: byte
          description: The Ed25519 private key sealed under the master key.
        public_keys:
          $ref: "#/components/schemas/PublicKeys"
    NewAccount:
      type: object
      description: |
        Everything a new local account stores. In `e2e` mode `recovery_auth_key`
        and `keys` are required; in `none` they must be absent.
      required: [username, auth_key, kdf]
      properties:
        username:
          type: string
          description: |
            1 to 64 of `a-z`, `0-9`, `.`, `_`, `-`, starting with a letter or
            digit. Case is folded.
          examples: [alice]
        email:
          type: string
          examples: [alice@example.com]
        auth_key:
          type: string
          format: byte
          description: 32 bytes, derived from the passphrase.
        kdf:
          $ref: "#/components/schemas/KDF"
        recovery_auth_key:
          type: string
          format: byte
          description: 32 bytes, derived from the recovery key.
        keys:
          $ref: "#/components/schemas/AccountKeys"
    CreatedUser:
      type: object
      required: [user_id]
      properties:
        user_id:
          type: string
          description: Id of the new user.
    SetupInfo:
      type: object
      required: [data_dir, version]
      properties:
        data_dir:
          type: string
          description: The data directory, set through the environment.
        free_bytes:
          type: integer
          format: int64
          description: Free space in the data directory, if it can be told.
        public_url:
          type: string
          description: The address given through the environment, if any.
        oidc_redirect_path:
          type: string
          description: Added to the public URL, this is the redirect URI to give a provider.
          examples: [/auth/oidc/callback]
        oidc_redirect_uri:
          type: string
          description: The whole redirect URI, if the public URL is known.
        version:
          type: string
    ValidateURLRequest:
      type: object
      required: [url]
      properties:
        url:
          type: string
    ValidatedURL:
      type: object
      required: [url, insecure]
      properties:
        url:
          type: string
          description: The address, normalised.
        insecure:
          type: boolean
          description: The address is plain HTTP.
    ServerSettingsInput:
      type: object
      required: [name, public_url, default_quota_bytes, language, time_zone, mode]
      properties:
        name:
          type: string
          description: 1 to 128 characters.
        public_url:
          type: string
        default_quota_bytes:
          type: integer
          format: int64
          description: Storage for a new user; 0 means no limit.
          minimum: 0
        language:
          type: string
          examples: [en, pt-BR]
        time_zone:
          type: string
          examples: [Europe/Madrid]
        mode:
          $ref: "#/components/schemas/Mode"
    SetupRequest:
      type: object
      required: [settings, admin]
      properties:
        settings:
          $ref: "#/components/schemas/ServerSettingsInput"
        admin:
          $ref: "#/components/schemas/NewAccount"
        sign_in:
          $ref: "#/components/schemas/SignInSettingsInput"
    Role:
      type: string
      enum: [admin, user]
    Profile:
      type: object
      required: [id, username, role, quota_bytes, totp_enabled, disabled, created_at]
      properties:
        id:
          type: string
        username:
          type: string
        email:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        quota_bytes:
          type: integer
          format: int64
          description: Storage allowed; 0 means no limit.
        sign_in_method:
          type: string
          description: |
            `local` signs in with a passphrase, `sso` only through the provider, and
            `both` is a local account linked to a provider identity.
          enum: [local, sso, both]
        totp_enabled:
          type: boolean
        disabled:
          type: boolean
        created_at:
          type: string
          format: date-time
    Account:
      type: object
      description: |
        What a client needs to unlock an account. For an account that has no KDF
        parameters of its own, a single sign-on account before enrolment or any in
        `none` mode, `kdf` is placeholder parameters that nothing is derived with.
      required: [user, mode, kdf]
      properties:
        enrolment_required:
          type: boolean
          description: |
            Only in `e2e` mode: this account has no keys yet. The client asks for an
            unlock passphrase, makes the keys and the recovery key, and calls
            `POST /auth/oidc/enrol`, before anything else.
        user:
          $ref: "#/components/schemas/Profile"
        mode:
          $ref: "#/components/schemas/Mode"
        kdf:
          $ref: "#/components/schemas/KDF"
        keys:
          $ref: "#/components/schemas/AccountKeys"
    LoginRequest:
      type: object
      required: [username, auth_key]
      properties:
        username:
          type: string
        auth_key:
          type: string
          format: byte
          description: Either auth key, 32 bytes.
        totp_code:
          type: string
          description: Needed when TOTP is on, unless a recovery code is given.
        totp_recovery_code:
          type: string
          description: Single use, in place of `totp_code`.
    RegisterRequest:
      type: object
      required: [account]
      properties:
        invite_token:
          type: string
          description: Required unless the server allows open sign-up.
        account:
          $ref: "#/components/schemas/NewAccount"
    RekeyRequest:
      type: object
      required: [current_auth_key]
      properties:
        current_auth_key:
          type: string
          format: byte
          description: Either current auth key.
        auth_key:
          type: string
          format: byte
        kdf:
          $ref: "#/components/schemas/KDF"
        wrapped_master_key:
          type: string
          format: byte
        recovery_auth_key:
          type: string
          format: byte
        wrapped_master_key_recovery:
          type: string
          format: byte
    SessionKey:
      type: object
      required: [key]
      properties:
        key:
          type: string
          format: byte
          description: 32 bytes.
    UserKeys:
      type: object
      required: [user_id, username, public_keys]
      properties:
        user_id:
          type: string
        username:
          type: string
        public_keys:
          $ref: "#/components/schemas/PublicKeys"
    Invite:
      type: object
      required: [id, role, created_at, expires_at, used]
      properties:
        id:
          type: string
        email:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        quota_bytes:
          type: integer
          format: int64
          description: Absent means the server default.
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        used:
          type: boolean
    CreateInviteRequest:
      type: object
      properties:
        current_auth_key:
          type: string
          format: byte
          description: Either current auth key. Required when `role` is `admin`.
        email:
          type: string
          description: Becomes the new user's address.
        role:
          $ref: "#/components/schemas/Role"
        quota_bytes:
          type: integer
          format: int64
          minimum: 0
        expires_in_seconds:
          type: integer
          format: int64
          description: Between a minute and 90 days; a week if absent.
    CreatedInvite:
      type: object
      required: [invite, token, link]
      properties:
        invite:
          $ref: "#/components/schemas/Invite"
        token:
          type: string
          description: The one-time token. Not stored; shown only now.
        link:
          type: string
          description: The address to send, with the token in the fragment.
    CurrentCredential:
      type: object
      required: [current_auth_key]
      properties:
        current_auth_key:
          type: string
          format: byte
          description: Either current auth key.
    TOTPEnrolment:
      type: object
      required: [secret, uri]
      properties:
        secret:
          type: string
          description: The secret in base32, to type by hand.
        uri:
          type: string
          description: The `otpauth://` address, to show as a QR code.
    ConfirmTOTPRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          examples: ["123456"]
    RecoveryCodes:
      type: object
      required: [recovery_codes]
      properties:
        recovery_codes:
          type: array
          items:
            type: string
    DisableTOTPRequest:
      type: object
      required: [current_auth_key]
      properties:
        current_auth_key:
          type: string
          format: byte
          description: Either current auth key.
        code:
          type: string
        recovery_code:
          type: string
    DeviceToken:
      type: object
      required: [id, name, created_at]
      properties:
        id:
          type: string
        name:
          type: string
          examples: [Angel's phone]
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
    CreateTokenRequest:
      type: object
      required: [name, current_auth_key]
      properties:
        name:
          type: string
          description: 1 to 128 characters.
        current_auth_key:
          type: string
          format: byte
          description: Either current auth key.
    CreatedToken:
      type: object
      required: [token, secret]
      properties:
        token:
          $ref: "#/components/schemas/DeviceToken"
        secret:
          type: string
          description: The value to send as `Authorization`. Not stored; shown only now.
    UpdateUserRequest:
      type: object
      properties:
        disabled:
          type: boolean
        quota_bytes:
          type: integer
          format: int64
          minimum: 0
    CreatedPasswordReset:
      type: object
      required: [token, link, expires_at]
      properties:
        token:
          type: string
          description: The one-time token. Not stored; shown only now.
        link:
          type: string
          description: The address to send, with the token in the fragment.
        expires_at:
          type: string
          format: date-time
    CompletePasswordResetRequest:
      type: object
      required: [token, auth_key, kdf]
      properties:
        token:
          type: string
        auth_key:
          type: string
          format: byte
          description: 32 bytes.
        kdf:
          $ref: "#/components/schemas/KDF"
    ServerSettings:
      type: object
      required: [name, public_url, default_quota_bytes, language, time_zone, mode, open_signup, proxy_untrusted, purge_grace_days, trash_retention_days]
      properties:
        name:
          type: string
        public_url:
          type: string
        default_quota_bytes:
          type: integer
          format: int64
        language:
          type: string
        time_zone:
          type: string
        mode:
          $ref: "#/components/schemas/Mode"
        open_signup:
          type: boolean
          description: Whether anyone can register without an invite.
        purge_grace_days:
          type: integer
          description: How many days purged data stays before its bytes are removed.
        trash_retention_days:
          type: integer
          description: How many days the trash keeps a node before purging it; 0 keeps it until someone does.
        local_accounts:
          type: boolean
          description: Whether local sign-in and registration are on. The first local admin can always sign in.
        oidc:
          $ref: "#/components/schemas/OIDCSettings"
        audit_retention_days:
          type: integer
          description: How many days the audit trail keeps an entry; 0 keeps it for good.
        journal_retention_days:
          type: integer
          description: |
            How many days the change journal keeps an entry; 0 keeps it for good. A
            client away for longer answers `cursor_expired` and reads the tree again.
        proxy_untrusted:
          type: boolean
          description: |
            This request carried forwarded headers from an address not in
            `YONDRIVE_TRUSTED_PROXIES`. They were ignored, so client addresses and
            HTTPS detection are wrong: the most likely misconfiguration.
    UpdateSettingsRequest:
      type: object
      description: Fields left out stay as they are. There is no field for the mode.
      properties:
        current_auth_key:
          type: string
          format: byte
          description: |
            Either current auth key. Required to shorten the grace period, as a
            stolen admin session must not be able to bring removal closer, to shorten
            the audit retention, as it must not be able to erase its tracks, and to change
            `oidc` or `local_accounts`, as whoever names the issuer can sign in as
            anyone it can match.
        local_accounts:
          type: boolean
          description: |
            Turning this off answers `local_accounts_lockout` unless single sign-on is on
            and a local admin remains, who can always still sign in.
        oidc:
          $ref: "#/components/schemas/OIDCSettingsInput"
        purge_grace_days:
          type: integer
          description: 1 to 3650. Applies to what is purged from now on.
          minimum: 1
          maximum: 3650
        trash_retention_days:
          type: integer
          description: 0 to 3650.
          minimum: 0
          maximum: 3650
        audit_retention_days:
          type: integer
          description: 0 to 3650.
          minimum: 0
          maximum: 3650
        journal_retention_days:
          type: integer
          description: 0 to 3650.
          minimum: 0
          maximum: 3650
        name:
          type: string
        public_url:
          type: string
        default_quota_bytes:
          type: integer
          format: int64
          minimum: 0
        language:
          type: string
        time_zone:
          type: string
        open_signup:
          type: boolean
    OIDCMatchMode:
      type: string
      description: |
        Which existing local account a new identity links to. `email` needs
        `email_verified` to be true. `sub` links nothing. An account linked to another
        identity is never moved, and that sign-in answers `sso_identity_conflict`.
      enum: [email, preferred_username, sub]
    OIDCNewUsers:
      type: string
      description: |
        What an identity that links to nothing gets: `create` makes an account at first
        sign-in, and `invited` needs an invite, by token or for its verified email.
      enum: [create, invited]
    OIDCSettings:
      type: object
      description: The settings as read. The client secret is never sent back.
      required: [enabled, label, issuer, client_id, client_secret_set, scopes, admin_group, admin_claim, match_mode, new_users, allow_insecure, redirect_uri]
      properties:
        enabled:
          type: boolean
        label:
          type: string
          description: The text of the sign-in button.
        issuer:
          type: string
        client_id:
          type: string
        client_secret_set:
          type: boolean
        scopes:
          type: string
          description: Separated by spaces.
        admin_group:
          type: string
          description: Empty means that sign-in never changes anyone's role.
        admin_claim:
          type: string
          description: The claim holding the groups.
        match_mode:
          $ref: "#/components/schemas/OIDCMatchMode"
        new_users:
          $ref: "#/components/schemas/OIDCNewUsers"
        allow_insecure:
          type: boolean
          description: Allow an issuer over plain http.
        redirect_uri:
          type: string
          description: What to register at the provider.
    OIDCSettingsInput:
      type: object
      description: |
        Fields left out stay as they are. With `enabled` true, `issuer`, `client_id` and
        a client secret must be known by now, or the answer is `invalid_oidc_settings`.
      properties:
        enabled:
          type: boolean
        label:
          type: string
          description: 1 to 128 characters.
        issuer:
          type: string
          description: Exactly as the provider spells it, trailing slash included.
        client_id:
          type: string
        client_secret:
          type: string
          description: Write-only. Absent or empty keeps the one stored.
        scopes:
          type: string
          description: Separated by spaces, including `openid`.
        admin_group:
          type: string
        admin_claim:
          type: string
        match_mode:
          $ref: "#/components/schemas/OIDCMatchMode"
        new_users:
          $ref: "#/components/schemas/OIDCNewUsers"
        allow_insecure:
          type: boolean
    SignInSettingsInput:
      type: object
      description: How people sign in, chosen in the wizard. Everything is optional.
      properties:
        local_accounts:
          type: boolean
          description: Defaults to true.
        open_signup:
          type: boolean
          description: Defaults to false.
        oidc:
          $ref: "#/components/schemas/OIDCSettingsInput"
    AuthMethods:
      type: object
      required: [local_accounts, open_signup]
      properties:
        local_accounts:
          type: boolean
        open_signup:
          type: boolean
        oidc:
          type: object
          description: Present when single sign-on is on.
          required: [label]
          properties:
            label:
              type: string
    OIDCStartRequest:
      type: object
      required: [invite_token]
      properties:
        invite_token:
          type: string
    OIDCStart:
      type: object
      required: [authorize_url]
      properties:
        authorize_url:
          type: string
    EnrolRequest:
      type: object
      required: [kdf, unlock_auth_key, recovery_auth_key, keys]
      properties:
        kdf:
          $ref: "#/components/schemas/KDF"
        unlock_auth_key:
          type: string
          format: byte
          description: |
            32 bytes, derived from the unlock passphrase. It never signs in: it only
            proves a current credential. See CRYPTO.md, section 3.
        recovery_auth_key:
          type: string
          format: byte
          description: 32 bytes, derived from the recovery key.
        keys:
          $ref: "#/components/schemas/AccountKeys"
    OIDCTestRequest:
      type: object
      required: [issuer]
      properties:
        issuer:
          type: string
        allow_insecure:
          type: boolean
    OIDCTestResult:
      type: object
      required: [issuer, authorization_endpoint, token_endpoint, jwks_uri, token_auth_method, pkce_s256, keys]
      properties:
        issuer:
          type: string
        authorization_endpoint:
          type: string
        token_endpoint:
          type: string
        userinfo_endpoint:
          type: string
        jwks_uri:
          type: string
        token_auth_method:
          type: string
          description: How this server will authenticate at the token endpoint.
        pkce_s256:
          type: boolean
          description: The provider says it supports S256. It is used either way.
        keys:
          type: integer
          description: How many of its signing keys this server can use.
    Suite:
      type: string
      description: |
        How an item is protected. It is recorded on every item, and must be the
        one that belongs to the server's mode, or the answer is `suite_mismatch`.
      enum: [xchacha20poly1305-v1, none]
    NodeKind:
      type: string
      enum: [file, folder]
    NodeRole:
      type: string
      description: |
        What the signed-in user may do with a node: the strongest of owning it and
        of the grants they hold on it and above it. A `viewer` reads. An `editor`
        also creates, renames, moves within the shared subtree, uploads versions and
        trashes, but not on the node a grant is on unless something above it is
        shared too, since those change the folder it lives in. Only an `owner`
        shares, rotates, restores, purges or deletes versions.
      enum: [owner, editor, viewer]
    Node:
      type: object
      description: |
        A file or folder. The server cannot read the sealed fields. On the node of
        a grant, with nothing above it shared, `parent_id` and `name_tag` are absent
        and `wrapped_key` empty, as they belong to a folder the grantee cannot see.
      required: [id, owner_id, kind, suite, sealed_metadata, wrapped_key, created_at, updated_at]
      properties:
        id:
          type: string
        owner_id:
          type: string
        parent_id:
          type: string
          description: Absent on a root.
        kind:
          $ref: "#/components/schemas/NodeKind"
        suite:
          $ref: "#/components/schemas/Suite"
        sealed_metadata:
          type: string
          format: byte
        wrapped_key:
          type: string
          format: byte
          description: Empty in `none` mode.
        name_tag:
          type: string
          format: byte
          description: Absent on a root.
        current_version:
          type: string
          description: Absent until a file's first commit.
        thumb_blob_id:
          type: string
          description: |
            A rotation removes it. One written by a client that had not yet seen a
            rotation does not open: treat it as missing, and make another.
        key_generation:
          type: integer
          format: int64
          description: |
            Which generation of this node's key is current: what `wrapped_key`,
            `sealed_metadata` and the wraps and tags of its children are sealed
            under. Starts at 1, and every rotation adds one. Always sent.
        role:
          $ref: "#/components/schemas/NodeRole"
        trashed_at:
          type: string
          format: date-time
          description: Set on the node that was trashed, not on what is under it.
        purged_at:
          type: string
          format: date-time
        remove_at:
          type: string
          format: date-time
          description: When the bytes go. Restoring before then cancels it.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    NodePage:
      type: object
      required: [nodes]
      properties:
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/Node"
        next_cursor:
          type: string
          description: Present if there may be more.
    CreateRootRequest:
      type: object
      required: [id, suite, wrapped_key]
      properties:
        id:
          type: string
          pattern: "^[0-9a-f]{32}$"
        suite:
          $ref: "#/components/schemas/Suite"
        sealed_metadata:
          type: string
          format: byte
          description: At most 64 KiB.
        wrapped_key:
          type: string
          format: byte
          description: Required in `e2e` mode, empty in `none`.
    CreateNodeRequest:
      type: object
      required: [id, parent_id, kind, suite, sealed_metadata, wrapped_key, name_tag]
      properties:
        id:
          type: string
          pattern: "^[0-9a-f]{32}$"
        parent_id:
          type: string
          pattern: "^[0-9a-f]{32}$"
        kind:
          $ref: "#/components/schemas/NodeKind"
        suite:
          $ref: "#/components/schemas/Suite"
        sealed_metadata:
          type: string
          format: byte
          description: 1 byte to 64 KiB.
        wrapped_key:
          type: string
          format: byte
          description: Required in `e2e` mode, empty in `none`.
        name_tag:
          type: string
          format: byte
          description: 32 bytes.
        parent_key_generation:
          type: integer
          format: int64
          description: |
            The generation of the parent's key that `wrapped_key` and `name_tag` were
            made under. A client MUST send it. If the parent has been rotated since,
            the answer is `key_generation_conflict`.
    UpdateNodeRequest:
      type: object
      description: Fields left out stay as they are.
      required: [suite]
      properties:
        suite:
          $ref: "#/components/schemas/Suite"
        sealed_metadata:
          type: string
          format: byte
        name_tag:
          type: string
          format: byte
          description: 32 bytes. A root has none.
        key_generation:
          type: integer
          format: int64
          description: The generation of this node's key that `sealed_metadata` is sealed under. A client MUST send it with `sealed_metadata`.
        parent_key_generation:
          type: integer
          format: int64
          description: The generation of the parent's key that `name_tag` was made under. A client MUST send it with `name_tag`.
    MoveNodeRequest:
      type: object
      required: [parent_id, wrapped_key, name_tag]
      properties:
        parent_id:
          type: string
          pattern: "^[0-9a-f]{32}$"
        wrapped_key:
          type: string
          format: byte
          description: The node key wrapped under the new parent. Empty in `none` mode.
        name_tag:
          type: string
          format: byte
          description: 32 bytes, under the new parent.
        parent_key_generation:
          type: integer
          format: int64
          description: The generation of the new parent's key that these were made under. A client MUST send it.
    EmptiedTrash:
      type: object
      required: [marked]
      properties:
        marked:
          type: integer
    VersionSummary:
      type: object
      required: [id, node_id, blob_id, suite, author_id, content_version_id, content_author_id, stored_size, frame_count, frame_size, created_at]
      properties:
        key_generation:
          type: integer
          format: int64
          description: The generation of the node's key this is sealed under. Always sent.
        id:
          type: string
        node_id:
          type: string
        blob_id:
          type: string
        suite:
          $ref: "#/components/schemas/Suite"
        author_id:
          type: string
          description: Who made this version, by upload or by restoring.
        content_version_id:
          type: string
          description: |
            The version id the frames were sealed and signed under: the one to use
            for the version key, the frame AAD and the manifest. It differs from
            `id` only on a restored version.
        content_author_id:
          type: string
          description: Who signed the manifest, whose key verifies it.
        stored_size:
          type: integer
          format: int64
        frame_count:
          type: integer
          format: int64
        frame_size:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time
        deleted_at:
          type: string
          format: date-time
        remove_at:
          type: string
          format: date-time
          description: When a deleted version goes.
    KeyLink:
      type: object
      required: [generation, sealed_key]
      properties:
        generation:
          type: integer
          format: int64
        sealed_key:
          type: string
          format: byte
          description: The key of this generation, sealed under the next one (CRYPTO.md, section 8).
    Version:
      allOf:
        - $ref: "#/components/schemas/VersionSummary"
        - type: object
          required: [frame_hashes, signature, manifest]
          properties:
            key_chain:
              type: array
              description: |
                How to get from the node's current key to the one this version is
                sealed under, newest link first. Absent when that is the current key,
                and always in `none` mode.
              items:
                $ref: "#/components/schemas/KeyLink"
            frame_hashes:
              type: string
              format: byte
              description: 32 bytes of SHA-256 per stored frame, in order.
            signature:
              type: string
              format: byte
              description: As sent at commit. Empty in `none` mode.
            manifest:
              type: string
              format: byte
              description: As sent at commit.
    VersionPage:
      type: object
      required: [versions]
      properties:
        versions:
          type: array
          items:
            $ref: "#/components/schemas/VersionSummary"
        next_cursor:
          type: string
          description: Present if there may be more.
    RestoreVersionRequest:
      type: object
      required: [version_id]
      properties:
        version_id:
          type: string
          pattern: "^[0-9a-f]{32}$"
          description: The id of the new version, chosen by the client.
        expected_version:
          type: string
          description: |
            The version the client believes is current. Left out, nothing is
            checked.
    Editing:
      type: object
      required: [editors, ttl_seconds]
      properties:
        editors:
          type: array
          description: Other people with a recent heartbeat, the caller left out.
          items:
            $ref: "#/components/schemas/Editor"
        ttl_seconds:
          type: integer
          description: How long a heartbeat holds.
    Editor:
      type: object
      required: [user_id, username, since]
      properties:
        user_id:
          type: string
        username:
          type: string
        since:
          type: string
          format: date-time
          description: When their current run of heartbeats began.
    CreateUploadRequest:
      type: object
      required: [node_id, version_id, suite, frame_count, frame_size, stored_size]
      properties:
        node_id:
          type: string
          pattern: "^[0-9a-f]{32}$"
        version_id:
          type: string
          pattern: "^[0-9a-f]{32}$"
          description: Chosen by the client, as it enters the frames' AAD.
        suite:
          $ref: "#/components/schemas/Suite"
        frame_count:
          type: integer
          format: int64
          minimum: 1
          maximum: 1048576
        frame_size:
          type: integer
          format: int64
          description: Plaintext bytes per frame.
          minimum: 1024
          maximum: 16777216
        stored_size:
          type: integer
          format: int64
          minimum: 0
        key_generation:
          type: integer
          format: int64
          description: |
            The generation of the node's key the frames will be sealed under. A client
            MUST send it. A rotation before the commit answers
            `key_generation_conflict` at commit: abort, and upload again under the new key.
    Upload:
      type: object
      required: [id, node_id, version_id, suite, frame_count, frame_size, stored_size, frames, created_at]
      properties:
        key_generation:
          type: integer
          format: int64
          description: The generation of the node's key this is sealed under. Always sent.
        id:
          type: string
          description: Also the id of the blob this upload becomes.
        node_id:
          type: string
        version_id:
          type: string
        suite:
          $ref: "#/components/schemas/Suite"
        frame_count:
          type: integer
          format: int64
        frame_size:
          type: integer
          format: int64
        stored_size:
          type: integer
          format: int64
        frames:
          type: array
          description: The indexes of the frames that have arrived, in order.
          items:
            type: integer
            format: int64
        created_at:
          type: string
          format: date-time
    UploadSummary:
      type: object
      description: An upload in a list. `GET /uploads/{id}` says which frames have arrived.
      required: [id, node_id, version_id, suite, frame_count, frame_size, stored_size, frames_received, created_at, updated_at]
      properties:
        id:
          type: string
        node_id:
          type: string
        version_id:
          type: string
        suite:
          $ref: "#/components/schemas/Suite"
        frame_count:
          type: integer
          format: int64
        frame_size:
          type: integer
          format: int64
        stored_size:
          type: integer
          format: int64
          description: What it holds of the owner's quota.
        frames_received:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    UploadPage:
      type: object
      required: [uploads]
      properties:
        uploads:
          type: array
          items:
            $ref: "#/components/schemas/UploadSummary"
        next_cursor:
          type: string
          description: Absent on the last page.
    CommitUploadRequest:
      type: object
      required: [signature, manifest]
      properties:
        signature:
          type: string
          format: byte
          description: 64 bytes in `e2e` mode, empty in `none`.
        manifest:
          type: string
          format: byte
          description: 1 byte to 4 KiB, opaque, kept as sent.
        expected_version:
          type: string
          description: |
            The version this save started from. An empty string means the file must
            have no version yet. Left out, nothing is checked and the last commit
            wins. On a mismatch the answer is `version_conflict` (412).
    SmallBlobKind:
      type: string
      enum: [thumb, index]
    SmallBlob:
      type: object
      required: [id, kind, suite, size, created_at]
      properties:
        id:
          type: string
        kind:
          $ref: "#/components/schemas/SmallBlobKind"
        suite:
          $ref: "#/components/schemas/Suite"
        size:
          type: integer
          format: int64
        node_id:
          type: string
        created_at:
          type: string
          format: date-time
    SmallBlobPage:
      type: object
      required: [blobs]
      properties:
        blobs:
          type: array
          items:
            $ref: "#/components/schemas/SmallBlob"
        next_cursor:
          type: string
          description: Present if there may be more.
    Storage:
      type: object
      required: [quota_bytes, used_bytes, reserved_bytes]
      properties:
        quota_bytes:
          type: integer
          format: int64
          description: Storage allowed; 0 means no limit.
        used_bytes:
          type: integer
          format: int64
          description: Stored bytes, including the trash until the bytes are removed.
        reserved_bytes:
          type: integer
          format: int64
          description: Held for uploads in progress.
    ChangeOp:
      type: string
      description: |
        `granted`: a grant on this node was made. `role_changed`: the caller's role
        over it changed. `rotated`: its key changed, along with the wraps and tags of
        its children, so read them again. `revoked`: the caller lost a way of reaching
        this node; read it, and if the answer is `not_found` drop it and all under it.
        Trashing a folder also appears as `trashed` on each grant under it.
      enum: [created, updated, moved, trashed, restored, purged, removed, version, version_deleted, thumbnail, granted, role_changed, revoked, rotated]
    Change:
      type: object
      required: [seq, node_id, op, at]
      properties:
        seq:
          type: integer
          format: int64
        node_id:
          type: string
        op:
          $ref: "#/components/schemas/ChangeOp"
        at:
          type: string
          format: date-time
    ChangePage:
      type: object
      required: [changes, next_cursor]
      properties:
        changes:
          type: array
          items:
            $ref: "#/components/schemas/Change"
        next_cursor:
          type: string
          description: Where to read from next, also when this page is empty.
    GrantRole:
      type: string
      enum: [viewer, editor]
    Grant:
      type: object
      description: |
        A role over a node and everything under it. `sealed_key` and `signature` are
        opaque to the server, and empty in `none` mode (CRYPTO.md, section 8). A client
        MUST verify the signature against the granter's pinned Ed25519 key before
        trusting the grant, and that the granter is the node's owner.
      required: [id, node_id, grantee_id, grantee_username, granter_id, granter_username, role, key_generation, sealed_key, signature, created_at]
      properties:
        id:
          type: string
        node_id:
          type: string
        grantee_id:
          type: string
        grantee_username:
          type: string
        granter_id:
          type: string
        granter_username:
          type: string
        role:
          $ref: "#/components/schemas/GrantRole"
        key_generation:
          type: integer
          format: int64
          description: The generation of the node's key that `sealed_key` holds.
        sealed_key:
          type: string
          format: byte
        signature:
          type: string
          format: byte
        created_at:
          type: string
          format: date-time
    GrantedNode:
      type: object
      required: [grant, node]
      properties:
        grant:
          $ref: "#/components/schemas/Grant"
        node:
          $ref: "#/components/schemas/Node"
    GrantPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/GrantedNode"
        next_cursor:
          type: string
          description: Present if there may be more.
    CreateGrantRequest:
      type: object
      required: [node_id, grantee_id, role, key_generation, sealed_key, signature]
      properties:
        node_id:
          type: string
          pattern: "^[0-9a-f]{32}$"
        grantee_id:
          type: string
          pattern: "^[0-9a-f]{32}$"
        role:
          $ref: "#/components/schemas/GrantRole"
        key_generation:
          type: integer
          format: int64
          description: The node's current generation, of the key being sealed.
        sealed_key:
          type: string
          format: byte
          description: The node key sealed to the grantee, 105 bytes. Empty in `none` mode.
        signature:
          type: string
          format: byte
          description: The granter's Ed25519 signature, 64 bytes. Empty in `none` mode.
    UpdateGrantRequest:
      type: object
      required: [role, signature]
      properties:
        role:
          $ref: "#/components/schemas/GrantRole"
        signature:
          type: string
          format: byte
          description: A new signature, as the role is signed. Empty in `none` mode.
    NodeAccess:
      type: object
      description: |
        One user's way of reaching a node. `grant_id`, `node_id`, `key_generation`,
        `sealed_key` and `signature` are given to the owner only, and `grant_id` to
        the holder of the grant too.
      required: [user_id, username, role, inherited]
      properties:
        user_id:
          type: string
        username:
          type: string
        role:
          $ref: "#/components/schemas/GrantRole"
        inherited:
          type: boolean
          description: The grant is on a folder above the node.
        grant_id:
          type: string
        node_id:
          type: string
        key_generation:
          type: integer
          format: int64
        sealed_key:
          type: string
          format: byte
        signature:
          type: string
          format: byte
    NodeAccessList:
      type: object
      required: [access]
      properties:
        access:
          type: array
          items:
            $ref: "#/components/schemas/NodeAccess"
    UserLookup:
      type: object
      required: [id, username]
      properties:
        id:
          type: string
        username:
          type: string
        public_keys:
          $ref: "#/components/schemas/PublicKeys"
    Notification:
      type: object
      description: A grant its holder has not marked as read. Ids only, as names are sealed.
      required: [grant_id, node_id, granter_id, created_at]
      properties:
        grant_id:
          type: string
        node_id:
          type: string
        granter_id:
          type: string
        created_at:
          type: string
          format: date-time
    NotificationList:
      type: object
      required: [notifications, has_more]
      properties:
        notifications:
          type: array
          description: The newest first, at most 50.
          items:
            $ref: "#/components/schemas/Notification"
        has_more:
          type: boolean
    MarkNotificationsReadRequest:
      type: object
      properties:
        grant_ids:
          type: array
          description: Which to mark. Absent marks all of them.
          maxItems: 1000
          items:
            type: string
            pattern: "^[0-9a-f]{32}$"
    RotatedChild:
      type: object
      required: [id, wrapped_key, name_tag]
      properties:
        id:
          type: string
          pattern: "^[0-9a-f]{32}$"
        wrapped_key:
          type: string
          format: byte
          description: The child's own key, unchanged, wrapped under the node's new key. Empty in `none` mode.
        name_tag:
          type: string
          format: byte
          description: 32 bytes, under the node's new key.
    RotatedGrant:
      type: object
      required: [grantee_id, sealed_key, signature]
      properties:
        grantee_id:
          type: string
          pattern: "^[0-9a-f]{32}$"
        sealed_key:
          type: string
          format: byte
          description: The new key sealed to the grantee, 105 bytes. Empty in `none` mode.
        signature:
          type: string
          format: byte
          description: 64 bytes, over the new generation. Empty in `none` mode.
    RotatedLink:
      type: object
      required: [id, sealed_key]
      properties:
        id:
          type: string
          pattern: "^[0-9a-f]{32}$"
        sealed_key:
          type: string
          format: byte
          description: The new key sealed under the link key, which `owner_sealed_key` holds, 73 bytes. Empty in `none` mode.
    RotateNodeRequest:
      type: object
      required: [key_generation, parent_key_generation, wrapped_key, previous_key, sealed_metadata, children, grants]
      properties:
        key_generation:
          type: integer
          format: int64
          description: The node's current generation, the one being replaced.
        parent_key_generation:
          type: integer
          format: int64
          description: The generation of the parent's key that `wrapped_key` is wrapped under.
        wrapped_key:
          type: string
          format: byte
          description: The new key wrapped under the parent. Empty in `none` mode.
        previous_key:
          type: string
          format: byte
          description: The old key sealed under the new one, 73 bytes. Empty in `none` mode.
        sealed_metadata:
          type: string
          format: byte
          description: The node's metadata sealed under the new key. 1 byte to 64 KiB.
        children:
          type: array
          description: Every direct child, in the trash too.
          items:
            $ref: "#/components/schemas/RotatedChild"
        grants:
          type: array
          description: Every grant on this node. Grants above and below it are not affected.
          items:
            $ref: "#/components/schemas/RotatedGrant"
        links:
          type: array
          description: |
            Every live link on this node, as `listLinks` shows them: not revoked and not
            expired. One that has ended since is ignored. Absent means none.
          items:
            $ref: "#/components/schemas/RotatedLink"
        drop_grants:
          type: array
          description: |
            Grantees whose grant on this node the owner's client could not verify: no
            signature, or not the owner's. They are deleted instead of sealed to, and
            count as named. Absent means none.
          items:
            type: string
            pattern: "^[0-9a-f]{32}$"
        drop_links:
          type: array
          description: |
            Live links on this node whose owner copy of the key does not open for the
            owner. They are revoked instead of sealed again, and count as named. Absent
            means none.
          items:
            type: string
            pattern: "^[0-9a-f]{32}$"
    LinkRole:
      type: string
      description: Links only ever give read access.
      enum: [view]
    LinkPassword:
      type: object
      required: [kdf, auth_key]
      properties:
        kdf:
          $ref: "#/components/schemas/KDF"
        auth_key:
          type: string
          format: byte
          description: |
            32 bytes from the password, in both modes, stored only as a hash (CRYPTO.md,
            section 19).
        wrapped_key:
          type: string
          format: byte
          description: The link key wrapped under the password, 73 bytes. Required in `e2e` mode, absent in `none`.
    CreateLinkRequest:
      type: object
      required: [id, node_id, role, key_generation, sealed_key, owner_sealed_key]
      properties:
        id:
          type: string
          pattern: "^[0-9a-f]{32}$"
          description: Chosen by the client, since it enters the AAD. It is what the URL carries.
        node_id:
          type: string
          pattern: "^[0-9a-f]{32}$"
        role:
          $ref: "#/components/schemas/LinkRole"
        key_generation:
          type: integer
          format: int64
          description: The node's current generation, of the key being sealed.
        sealed_key:
          type: string
          format: byte
          description: The node key sealed under the link key, 73 bytes. Empty in `none` mode.
        owner_sealed_key:
          type: string
          format: byte
          description: The link key sealed for its owner, 73 bytes, so a rotation can reach it. Empty in `none` mode.
        expires_at:
          type: string
          format: date-time
        download_limit:
          type: integer
          format: int64
          minimum: 1
          description: How many files may be fetched in all. See `getPublicBlob` for what counts.
        password:
          $ref: "#/components/schemas/LinkPassword"
    Link:
      type: object
      required: [id, node_id, role, key_generation, sealed_key, owner_sealed_key, has_password, download_count, created_at]
      properties:
        id:
          type: string
        node_id:
          type: string
        role:
          $ref: "#/components/schemas/LinkRole"
        key_generation:
          type: integer
          format: int64
        sealed_key:
          type: string
          format: byte
        owner_sealed_key:
          type: string
          format: byte
        has_password:
          type: boolean
        expires_at:
          type: string
          format: date-time
        download_limit:
          type: integer
          format: int64
        download_count:
          type: integer
          format: int64
        revoked_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
    LinkedNode:
      type: object
      required: [link, node]
      properties:
        link:
          $ref: "#/components/schemas/Link"
        node:
          $ref: "#/components/schemas/Node"
    LinkPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/LinkedNode"
        next_cursor:
          type: string
          description: Present if there may be more.
    PublicNode:
      type: object
      description: |
        A node as a link shows it: no owner and no trash. The link's own node has no
        `parent_id`, and an empty `wrapped_key`: its key comes from `sealed_key`.
      required: [id, kind, suite, sealed_metadata, wrapped_key, key_generation, created_at, updated_at]
      properties:
        id:
          type: string
        parent_id:
          type: string
        kind:
          $ref: "#/components/schemas/NodeKind"
        suite:
          $ref: "#/components/schemas/Suite"
        sealed_metadata:
          type: string
          format: byte
        wrapped_key:
          type: string
          format: byte
          description: This node's key wrapped under its parent's. Empty in `none` mode.
        key_generation:
          type: integer
          format: int64
        current_version:
          type: string
        thumb_blob_id:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    PublicNodePage:
      type: object
      required: [nodes]
      properties:
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/PublicNode"
        next_cursor:
          type: string
          description: Present if there may be more.
    PublicLink:
      type: object
      description: |
        `password_required` carries `kdf` and nothing else that belongs to the link.
        `open` carries `node`, `sealed_key`, `key_generation`, `token` and
        `token_expires_at`, with `sealed_key` empty in `none` mode, and on a link with a
        password in `e2e` mode `password_wrapped_key`, which opens under the link KEK.
      required: [id, state]
      properties:
        id:
          type: string
        state:
          type: string
          enum: [open, password_required]
        kdf:
          $ref: "#/components/schemas/KDF"
        password_wrapped_key:
          type: string
          format: byte
        node:
          $ref: "#/components/schemas/PublicNode"
        sealed_key:
          type: string
          format: byte
          description: The link's node's key, sealed under the link key.
        key_generation:
          type: integer
          format: int64
          description: The generation of the node's key that `sealed_key` holds.
        token:
          type: string
          description: Goes in `X-Link-Token`. Keep it in memory and renew it with `getPublicLink` before it ends.
        token_expires_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        downloads_remaining:
          type: integer
          format: int64
          description: Absent if the link has no limit.
    UnlockLinkRequest:
      type: object
      required: [auth_key]
      properties:
        auth_key:
          type: string
          format: byte
          description: 32 bytes. See `LinkPassword`.
    PublicVersion:
      type: object
      description: |
        What a reader needs to read a node's current version, and no more. The signer
        is named by their key alone. `author_public_key` is absent in `none` mode and if
        the account has gone.
      required: [id, node_id, blob_id, suite, content_version_id, key_generation, stored_size, frame_count, frame_size, frame_hashes, signature, manifest]
      properties:
        id:
          type: string
        node_id:
          type: string
        blob_id:
          type: string
        suite:
          $ref: "#/components/schemas/Suite"
        content_version_id:
          type: string
        key_generation:
          type: integer
          format: int64
        key_chain:
          type: array
          description: As on `Version`.
          items:
            $ref: "#/components/schemas/KeyLink"
        stored_size:
          type: integer
          format: int64
        frame_count:
          type: integer
          format: int64
        frame_size:
          type: integer
          format: int64
        frame_hashes:
          type: string
          format: byte
        signature:
          type: string
          format: byte
        manifest:
          type: string
          format: byte
        author_public_key:
          type: string
          format: byte
    AdminHealth:
      type: object
      required: [version, mode, blobs, stored_bytes, uploads, reserved_bytes, pending_removals]
      properties:
        version:
          type: string
        commit:
          type: string
        web_bundle:
          $ref: "#/components/schemas/WebBundle"
        mode:
          $ref: "#/components/schemas/Mode"
        blobs:
          type: integer
          format: int64
        stored_bytes:
          type: integer
          format: int64
        uploads:
          type: integer
          format: int64
        reserved_bytes:
          type: integer
          format: int64
        pending_removals:
          type: integer
          format: int64
          description: Files whose records are gone and which the sweeper has yet to unlink.
        free_bytes:
          type: integer
          format: int64
          description: Free space in the data directory, if it can be told.
        last_backup_at:
          type: string
          format: date-time
          description: When `yondrive backup` last finished, if ever.
        oidc_enabled:
          type: boolean
        sso_users:
          type: integer
          format: int64
          description: Accounts linked to a provider identity.
        audit_entries:
          type: integer
          format: int64
          description: Entries in the audit trail.
        journal_entries:
          type: integer
          format: int64
          description: Entries in the change journal, over all users.
    AuditEntry:
      type: object
      required: [id, at, action]
      properties:
        id:
          type: integer
          format: int64
        at:
          type: string
          format: date-time
        action:
          type: string
          description: A stable name for the event, such as `login_failed`.
          examples: [login_succeeded]
        actor_id:
          type: string
          description: The user who did it, if known.
        target_id:
          type: string
          description: What it was done to, if anything.
        remote:
          type: string
          description: The address it came from, if known.
    AuditPage:
      type: object
      required: [entries]
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/AuditEntry"
        next_cursor:
          type: string
          description: Older entries are read from here. Absent on the last page.
  parameters:
    ID:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: A record id, 32 lowercase hex characters. Anything else answers `invalid_id`.
    VersionID:
      name: version_id
      in: path
      required: true
      schema:
        type: string
        pattern: "^[0-9a-f]{32}$"
      description: A version id.
    IDCursor:
      name: cursor
      in: query
      schema:
        type: string
        pattern: "^[0-9a-f]{32}$"
      description: The `next_cursor` of the previous page.
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 200
      description: The most to return. Anything above the maximum is treated as it.
    LinkToken:
      name: X-Link-Token
      in: header
      schema:
        type: string
      description: |
        The token of an open link. Bound to one link and its node, and good for 15 minutes.
        Anything missing answers `link_token_required`, anything else wrong
        `link_token_invalid`.
    LinkNodeID:
      name: node_id
      in: path
      required: true
      schema:
        type: string
        pattern: "^[0-9a-f]{32}$"
      description: A node at or under the link's. Anything else answers `not_found`.
    ContentSHA256:
      name: X-Content-SHA256
      in: header
      required: true
      schema:
        type: string
      description: The SHA-256 of the body, in padded standard base64.
  responses:
    Error:
      description: The request failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
