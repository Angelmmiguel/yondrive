# Continuous integration. Every job runs the same commands a developer runs
# locally, inside the flake's shell, so CI and `just` never drift: the Go
# toolchain, Node, pnpm and the Playwright browsers all come from flake.lock.
# The image is published only after every suite passes on that commit. A
# release (release.yml, on a v* tag) builds only a commit whose run here
# passed. A push that changes only Markdown runs nothing: there is nothing in
# it to test, and a release counts it as tested by the run before it.
name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  pull_request:
  workflow_dispatch:

# A new push to a branch makes the previous run obsolete, but a run that may
# publish is left to finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # The flake's shellHook keeps GOPATH and the build cache in .go, so a
      # single path covers both the module cache and the compiler cache.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .go
          key: go-${{ runner.os }}-${{ github.job }}-${{ hashFiles('go.mod') }}-${{ github.sha }}
          restore-keys: |
            go-${{ runner.os }}-${{ github.job }}-${{ hashFiles('go.mod') }}-
            go-${{ runner.os }}-${{ github.job }}-
            go-${{ runner.os }}-

      - name: gofmt
        run: |
          files=$(nix develop --command just fmt)
          [ -z "$files" ] || { echo 'gofmt would rewrite:'; echo "$files"; exit 1; }

      - name: Vet and lint
        run: |
          nix develop --command go vet ./...
          nix develop --command golangci-lint run

      - name: Test
        run: nix develop --command go test -race ./...

  api:
    name: OpenAPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: web/node_modules
          key: pnpm-${{ runner.os }}-${{ hashFiles('web/pnpm-lock.yaml') }}

      # Lints the spec, regenerates the Go and TypeScript code and fails if
      # either differs from what is committed.
      - name: Generated code is up to date
        run: nix develop --command just api-check

      # The rendered reference (docs/API.md), so a spec that lints but does not
      # render fails here rather than at a release.
      - name: API reference renders
        run: nix develop --command just api-docs

  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # pnpm resolves nothing at install time with a frozen lockfile, so the
      # tree it produces is a pure function of the lockfile.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: web/node_modules
          key: pnpm-${{ runner.os }}-${{ hashFiles('web/pnpm-lock.yaml') }}

      - name: Install
        run: nix develop --command just web-install

      - name: Type-check, lint and format
        run: nix develop --command just web-check

      - name: Test
        run: nix develop --command just web-test

  e2e:
    name: End to end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # The specs build the Go binary themselves (web/tests/server.ts), so this
      # job needs the Go caches as much as the backend one does.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .go
          key: go-${{ runner.os }}-${{ github.job }}-${{ hashFiles('go.mod') }}-${{ github.sha }}
          restore-keys: |
            go-${{ runner.os }}-${{ github.job }}-${{ hashFiles('go.mod') }}-
            go-${{ runner.os }}-${{ github.job }}-
            go-${{ runner.os }}-

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: web/node_modules
          key: pnpm-${{ runner.os }}-${{ hashFiles('web/pnpm-lock.yaml') }}

      - name: Install
        run: nix develop --command just web-install

      # Builds the web app, then runs the browser specs against a throwaway
      # server per file. The browsers come from the flake, so nothing is
      # downloaded here.
      - name: Browser specs
        run: nix develop --command just web-e2e

      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7
          if-no-files-found: ignore

  publish:
    name: Publish image
    # Only after the whole suite is green on this commit, and only for a push
    # to main: a pull request must not publish, and a release publishes its own
    # images once this workflow has passed. Re-run it to publish again.
    needs: [backend, api, web, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # The tags, for the version below.
          fetch-depth: 0
          persist-credentials: false

      # What the image reports as its version: `git describe` once a release
      # exists (1.0.0-4-gabc123def456, four commits past 1.0.0), and
      # 0.0.0-main+<commit> before, never `latest`.
      - name: Stamp
        run: |
          described=$(git describe --tags --match 'v[0-9]*' --abbrev=12 2>/dev/null | sed 's/^v//' || true)
          {
            echo "YONDRIVE_VERSION=${described:-0.0.0-main+${GITHUB_SHA::12}}"
            echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)"
          } >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # main publishes `latest`, unsigned. The package name must be lower case,
      # which the owner's login is not.
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/angelmmiguel/yondrive
          flavor: latest=false
          tags: |
            type=raw,value=latest

      # linux/amd64 only, the platform Unraid runs, as `just image` builds.
      # Provenance is off so the package holds one image per tag rather than
      # an index with an attestation beside it, which also lets GHCR read the
      # description and the repository from the image's labels (Dockerfile).
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          build-args: |
            VERSION=${{ env.YONDRIVE_VERSION }}
            COMMIT=${{ github.sha }}
            SOURCE_DATE_EPOCH=${{ env.SOURCE_DATE_EPOCH }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
