# Continuous integration. Every job runs the same commands a developer runs
# locally, inside the flake's shell, so CI and `just` never drift: the Go
# toolchain, Node, pnpm and the Playwright browsers all come from flake.lock.
# The image is published only after every suite passes on that commit. A
# release (release.yml, on a v* tag) calls this workflow first and builds
# only once it passes.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

# A new push to a branch makes the previous run obsolete, but a run that may
# publish is left to finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # The flake's shellHook keeps GOPATH and the build cache in .go, so a
      # single path covers both the module cache and the compiler cache.
      - uses: actions/cache@v4
        with:
          path: .go
          key: go-${{ runner.os }}-${{ github.job }}-${{ hashFiles('go.mod') }}-${{ github.sha }}
          restore-keys: |
            go-${{ runner.os }}-${{ github.job }}-${{ hashFiles('go.mod') }}-
            go-${{ runner.os }}-${{ github.job }}-
            go-${{ runner.os }}-

      - name: gofmt
        run: |
          files=$(nix develop --command just fmt)
          [ -z "$files" ] || { echo 'gofmt would rewrite:'; echo "$files"; exit 1; }

      - name: Vet and lint
        run: |
          nix develop --command go vet ./...
          nix develop --command golangci-lint run

      - name: Test
        run: nix develop --command go test -race ./...

  api:
    name: OpenAPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - uses: actions/cache@v4
        with:
          path: web/node_modules
          key: pnpm-${{ runner.os }}-${{ hashFiles('web/pnpm-lock.yaml') }}

      # Lints the spec, regenerates the Go and TypeScript code and fails if
      # either differs from what is committed.
      - name: Generated code is up to date
        run: nix develop --command just api-check

      # The rendered reference (docs/API.md), so a spec that lints but does not
      # render fails here rather than at a release.
      - name: API reference renders
        run: nix develop --command just api-docs

  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # pnpm resolves nothing at install time with a frozen lockfile, so the
      # tree it produces is a pure function of the lockfile.
      - uses: actions/cache@v4
        with:
          path: web/node_modules
          key: pnpm-${{ runner.os }}-${{ hashFiles('web/pnpm-lock.yaml') }}

      - name: Install
        run: nix develop --command just web-install

      - name: Type-check, lint and format
        run: nix develop --command just web-check

      - name: Test
        run: nix develop --command just web-test

  e2e:
    name: End to end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # The specs build the Go binary themselves (web/tests/server.ts), so this
      # job needs the Go caches as much as the backend one does.
      - uses: actions/cache@v4
        with:
          path: .go
          key: go-${{ runner.os }}-${{ github.job }}-${{ hashFiles('go.mod') }}-${{ github.sha }}
          restore-keys: |
            go-${{ runner.os }}-${{ github.job }}-${{ hashFiles('go.mod') }}-
            go-${{ runner.os }}-${{ github.job }}-
            go-${{ runner.os }}-

      - uses: actions/cache@v4
        with:
          path: web/node_modules
          key: pnpm-${{ runner.os }}-${{ hashFiles('web/pnpm-lock.yaml') }}

      - name: Install
        run: nix develop --command just web-install

      # Builds the web app, then runs the browser specs against a throwaway
      # server per file. The browsers come from the flake, so nothing is
      # downloaded here.
      - name: Browser specs
        run: nix develop --command just web-e2e

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7
          if-no-files-found: ignore

  publish:
    name: Publish image
    # Only after the whole suite is green on this commit, and only for a push
    # to main: a pull request must not publish, and a release publishes its own
    # images once this workflow has passed. Re-run it to publish again.
    needs: [backend, api, web, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # main publishes `latest`. The package name must be lower case, which
      # the owner's login is not.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/angelmmiguel/yondrive
          flavor: latest=false
          tags: |
            type=raw,value=latest

      # linux/amd64 only, the platform Unraid runs, as `just image` builds.
      # Provenance is off so the package holds one image per tag rather than
      # an index with an attestation beside it.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
