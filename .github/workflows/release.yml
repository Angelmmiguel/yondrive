# Releases. Pushing a tag vX.Y.Z checks that CI passed on that commit, waits
# for one approval, and builds and publishes the release:
#
#   - static binaries for linux and darwin on amd64 and arm64 (`just dist`),
#     the web app's hash list, SHA256SUMS and an SBOM;
#   - the container image for linux/amd64 and linux/arm64;
#   - keyless signatures (cosign, with this repository's GitHub OIDC identity)
#     over SHA256SUMS and the image, and build provenance for both;
#   - a GitHub release carrying all of it, with notes from CHANGELOG.md.
#
# Nothing is built or published until `guard` has checked the tag: a release
# version, on a commit that is on main, with a dated section in CHANGELOG.md,
# whose CI run on main passed. CI is not run again: a commit that changed only
# Markdown, which CI skips, counts as tested when the commits before it up to
# one that passed changed only Markdown too. Nothing is pushed, signed or
# published until `approve`, the one job in the `release` environment, has
# been approved; the binaries build meanwhile.
#
# Building runs the web app's dependencies (Vite and its plugins), so no job
# that builds can sign: `binaries` and `image` have no OIDC token, and `sign`
# and `sign-image` only download what was built and sign it, running nothing
# from the repository's dependencies. A compromised package can still change
# what it builds, which the reproducible build lets anyone detect, but it
# cannot sign anything as this workflow.
#
# Every action is pinned by commit; Dependabot proposes updates. Every tool
# comes from the flake: the build from the default shell, cosign and syft from
# the `release` one. docs/RELEASE.md says how to verify the result, and which
# repository settings this relies on.
name: Release

on:
  push:
    tags: ["v*"]

# One run per tag; a second push of the same tag waits rather than racing.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/angelmmiguel/yondrive

jobs:
  guard:
    name: Tag, branch, changelog and CI
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # the CI runs of the tagged commit
    outputs:
      version: ${{ steps.tag.outputs.version }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # All branches, to see main.
          fetch-depth: 0
          persist-credentials: false

      # vX.Y.Z, or vX.Y.Z-something for a pre-release. Anything else that
      # matches v* (vtest, v1, v1.2) is not a release.
      - id: tag
        name: The tag is a release version
        run: |
          if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::$GITHUB_REF_NAME is not vX.Y.Z or vX.Y.Z-pre"; exit 1
          fi
          version="${GITHUB_REF_NAME#v}"
          prerelease=false
          [[ "$version" == *-* ]] && prerelease=true
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      # Only what has reached main is released, so a tag on a branch nobody
      # reviewed signs nothing.
      - name: The commit is on main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$GITHUB_SHA is not on main"; exit 1; }

      # The section of CHANGELOG.md headed with this version, up to the next
      # one. A release needs one with its date; a pre-release takes the section
      # of the version it leads to, which may still say Unreleased.
      - name: Notes
        env:
          VERSION: ${{ steps.tag.outputs.version }}
          PRERELEASE: ${{ steps.tag.outputs.prerelease }}
        run: |
          section="${VERSION%%-*}"
          awk -v v="$section" '
            /^## / { if (found) exit; if (index($0, "## [" v "]") == 1) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "::error::CHANGELOG.md has no section for $section"; exit 1; }
          if [ "$PRERELEASE" = false ] && grep -q '^## \['"$VERSION"'\] - Unreleased' CHANGELOG.md; then
            echo "::error::CHANGELOG.md still marks $VERSION as unreleased"; exit 1
          fi

      # The tagged commit passed CI on main, or changed only Markdown since
      # the latest of its first-parent ancestors that did. A run still in
      # progress does not count: wait for it, then tag.
      - name: CI passed on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for sha in $(git rev-list --first-parent --max-count=50 "$GITHUB_SHA"); do
            passed=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$sha&branch=main&event=push&status=success" -q .total_count)
            if [ "$passed" -gt 0 ]; then
              echo "CI passed on $sha"; exit 0
            fi
            changed=$(git diff-tree --no-commit-id --name-only -r "$sha^" "$sha")
            if grep -v '\.md$' <<< "$changed" | grep -q .; then
              echo "::error::$sha changed more than Markdown and has no CI run on main that passed"; exit 1
            fi
          done
          echo "::error::no CI run on main passed in the last 50 commits"; exit 1

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notes
          path: notes.md
          if-no-files-found: error

  # The release's one approval. Every job that pushes, signs or publishes
  # needs it; only this job is in the `release` environment, whose reviewers
  # and tag rule (docs/RELEASE.md) gate the whole release at once.
  approve:
    name: Approval
    needs: [guard]
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Approved
        env:
          VERSION: ${{ needs.guard.outputs.version }}
        run: echo "Releasing $VERSION"

  binaries:
    name: Binaries, checksums and SBOM
    needs: [guard]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@91f6a0f59e94dfb2cfed0f4000f36a68ead1d20c # v31.11.4
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # The same stamp `just` derives from git: the tag without its v, the
      # commit, and the commit's time.
      - name: Stamp
        env:
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          {
            echo "YONDRIVE_VERSION=$VERSION"
            echo "YONDRIVE_COMMIT=$GITHUB_SHA"
            echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)"
          } >> "$GITHUB_ENV"

      - name: Install
        run: nix develop --command just web-install

      # Four static binaries and web-bundle.sha256, with the flags of `just build`.
      - name: Build
        run: nix develop --command just dist

      # Two SBOMs: the Go modules linked into the binary, read from its build
      # information, and every package in the web app's lockfile (build-time
      # tools included, as the lockfile does not tell them apart).
      - name: SBOM
        run: |
          nix develop .#release --command syft scan file:dist/yondrive-linux-amd64 \
            --source-name yondrive --source-version "$YONDRIVE_VERSION" \
            -o spdx-json=dist/yondrive-go.spdx.json
          nix develop .#release --command syft scan file:web/pnpm-lock.yaml \
            --source-name yondrive-web --source-version "$YONDRIVE_VERSION" \
            -o spdx-json=dist/yondrive-web.spdx.json

      # The API reference rendered from the spec of this release.
      - name: API reference
        run: nix develop --command just api-docs dist/yondrive-api-reference.html

      - name: Checksums
        working-directory: dist
        run: sha256sum yondrive-* web-bundle.sha256 > SHA256SUMS && cat SHA256SUMS

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # Signs what `binaries` built, from the artifact alone: nothing here installs
  # or runs the web app's dependencies. The checkout is for the flake that
  # pins cosign.
  sign:
    name: Sign the binaries
    needs: [guard, approve, binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # keyless signing and provenance
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@91f6a0f59e94dfb2cfed0f4000f36a68ead1d20c # v31.11.4
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      # The signature is a Sigstore bundle: the signature, the short-lived
      # certificate naming this workflow at this tag, and the transparency log
      # entry. No key exists to leak.
      - name: Sign the checksums
        run: nix develop .#release --command cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json dist/SHA256SUMS

      - name: Provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signature
          path: SHA256SUMS.sigstore.json
          if-no-files-found: error

  # Builds and pushes the image, with no OIDC token: the build runs the web
  # app's dependencies. `sign-image` signs what this pushed, by digest.
  image:
    name: Image
    needs: [guard, approve]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Stamp
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The release's version, and for a release (not a pre-release) its minor
      # and major lines. `latest` follows main (ci.yml), never a tag.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ needs.guard.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ needs.guard.outputs.prerelease == 'false' }}
            type=semver,pattern={{major}},enable=${{ needs.guard.outputs.prerelease == 'false' }}

      # The Dockerfile cross-compiles for each platform on the runner's own,
      # so the arm64 binary in the image is the one `just dist` builds. The
      # layers take the commit's time rather than the build's. Its labels name
      # the repository, the licence and the version; the index carries the same
      # annotations, which is where GHCR reads a multi-platform package's.
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          provenance: false
          build-args: |
            VERSION=${{ needs.guard.outputs.version }}
            COMMIT=${{ github.sha }}
            SOURCE_DATE_EPOCH=${{ env.SOURCE_DATE_EPOCH }}
          outputs: type=image,push=true,rewrite-timestamp=true
          tags: ${{ steps.meta.outputs.tags }}
          annotations: |
            index:org.opencontainers.image.title=YonDrive
            index:org.opencontainers.image.description=Self-hosted files, documents and notes with zero-knowledge encryption.
            index:org.opencontainers.image.source=https://github.com/Angelmmiguel/yondrive
            index:org.opencontainers.image.licenses=AGPL-3.0-only
            index:org.opencontainers.image.version=${{ needs.guard.outputs.version }}
            index:org.opencontainers.image.revision=${{ github.sha }}
        env:
          SOURCE_DATE_EPOCH: ${{ env.SOURCE_DATE_EPOCH }}

  # Signs the image by digest, so the signature covers every platform and no
  # tag can be moved under it. Nothing is built here.
  sign-image:
    name: Sign the image
    needs: [guard, approve, image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # the signature and the attestation are pushed beside the image
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@91f6a0f59e94dfb2cfed0f4000f36a68ead1d20c # v31.11.4
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign the image
        env:
          DIGEST: ${{ needs.image.outputs.digest }}
        run: nix develop .#release --command cosign sign --yes "$IMAGE@$DIGEST"

      - name: Provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ needs.image.outputs.digest }}
          push-to-registry: true

  release:
    name: GitHub release
    needs: [guard, approve, sign, image, sign-image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signature
          path: dist

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: notes

      - name: Notes
        env:
          VERSION: ${{ needs.guard.outputs.version }}
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          {
            echo
            echo "Image: \`${IMAGE}:${VERSION}\` (\`${IMAGE}@${DIGEST}\`)"
            echo "Web app: \`$(sha256sum dist/web-bundle.sha256 | cut -d' ' -f1)\`"
            echo
            echo "Verify the downloads, the signatures and the provenance as docs/RELEASE.md describes."
          } >> notes.md

      # A pre-release is marked so, and does not become the latest release.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.guard.outputs.version }}
          PRERELEASE: ${{ needs.guard.outputs.prerelease }}
        run: |
          flags=(--latest)
          [ "$PRERELEASE" = true ] && flags=(--prerelease --latest=false)
          gh release create "$GITHUB_REF_NAME" dist/* -R "$GITHUB_REPOSITORY" \
            --verify-tag --title "YonDrive $VERSION" --notes-file notes.md "${flags[@]}"
